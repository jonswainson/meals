<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>Shopping</title>
<style>
  :root{--bg:#faf9f7;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e2e0dc;
    --card:#fff;--soft:#f3f1ed;--accent:#8a5a2b;--go:#3d7a4e;--hot:#a03232}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#141414;--fg:#ededed;--muted:#9a9a9a;--line:#2e2e2e;
    --card:#1c1c1c;--soft:#232323;--accent:#d9a05b;--go:#7dc48f;--hot:#e08585}}
  :root[data-theme="dark"]{--bg:#141414;--fg:#ededed;--muted:#9a9a9a;--line:#2e2e2e;
    --card:#1c1c1c;--soft:#232323;--accent:#d9a05b;--go:#7dc48f;--hot:#e08585}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:620px;margin-inline:auto;padding:0 0 140px;
    -webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:14px 16px 10px;
    padding-top:max(14px,env(safe-area-inset-top))}
  h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.8rem;margin:2px 0 0}
  .bar{height:4px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--go);width:0;
    transition:width .25s ease;border-radius:99px}
  .barrow{display:flex;align-items:center;gap:12px;margin-top:9px}
  .barrow .bar{flex:1;margin:0}
  .count{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;
    white-space:nowrap}

  .stock{margin:14px 16px 0;background:var(--soft);border-radius:10px;overflow:hidden}
  .stock summary{cursor:pointer;list-style:none;padding:12px 14px;
    font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .stock summary::-webkit-details-marker{display:none}
  .stock summary::after{content:"▾";float:right;color:var(--muted);
    font-size:.9rem;transform:translateY(-1px)}
  .stock[open] summary::after{content:"▴"}
  .stock p{margin:0;padding:0 14px 14px;font-size:.88rem;color:var(--muted);line-height:1.65}
  .sp{display:flex;align-items:center;gap:10px;padding:9px 14px;
    border-top:1px solid var(--line)}
  .sp .n{flex:1;font-size:.92rem;min-width:0}
  .sp .n em{font-style:normal;color:var(--muted);font-size:.82rem;display:block}
  .sp button{flex:0 0 auto;font:inherit;font-size:.78rem;font-weight:600;
    padding:8px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);min-width:60px}
  .sp button.need{border-color:var(--accent);color:var(--accent)}
  .stockfoot{padding:11px 14px 14px!important;font-size:.82rem!important}
  .stockfoot a{color:var(--accent);text-decoration:none;font-weight:600}

  .sec{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:26px 16px 6px}

  ul{list-style:none;margin:0;padding:0;background:var(--card);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  li{display:flex;align-items:center;gap:14px;padding:0 16px;
    border-bottom:1px solid var(--line);min-height:56px;cursor:pointer;
    user-select:none;transition:background .12s}
  li:last-child{border-bottom:none}
  li:active{background:var(--soft)}
  .box{flex:0 0 24px;height:24px;border:2px solid var(--line);border-radius:7px;
    display:grid;place-items:center;transition:all .15s}
  .box svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s}
  li.on .box{background:var(--go);border-color:var(--go)}
  li.on .box svg{opacity:1;transform:scale(1)}
  .txt{flex:1;padding:12px 0;min-width:0}
  .nm{display:block;transition:opacity .15s}
  .qt{display:block;font-size:.82rem;color:var(--muted);margin-top:1px;
    font-variant-numeric:tabular-nums}
  li.on .nm{text-decoration:line-through;opacity:.4}
  li.on .qt{opacity:.4}
  .rm{flex:0 0 auto;color:var(--muted);font-size:1.3rem;line-height:1;
    padding:10px;margin-right:-10px;opacity:.5}

  .add{margin:26px 16px 0;display:flex;gap:8px}
  .add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 14px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--fg);-webkit-appearance:none}
  .add input::placeholder{color:var(--muted)}
  .add button{flex:0 0 auto;font:inherit;font-weight:600;font-size:.95rem;
    padding:13px 18px;border:none;border-radius:10px;
    background:var(--accent);color:#fff}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--bg);border-top:1px solid var(--line);
    padding:10px 16px max(10px,env(safe-area-inset-bottom));
    display:flex;gap:8px;max-width:620px;margin-inline:auto}
  .foot button{flex:1;font:inherit;font-weight:600;font-size:.92rem;
    padding:14px 10px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--fg)}
  .foot button[disabled]{opacity:.35}
  .foot .share{background:var(--accent);color:#fff;border-color:var(--accent);flex:1.4}

  .toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);
    background:var(--fg);color:var(--bg);font-size:.85rem;font-weight:500;
    padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;
    transition:all .22s;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .note{margin:22px 16px 0;font-size:.83rem;color:var(--muted);line-height:1.6}
  .done{margin:22px 16px 0;padding:14px 16px;background:var(--soft);
    border-radius:10px;font-size:.9rem;display:none}
  .done.show{display:block}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
    <h1>Shopping</h1>
    <a href="plan.html" style="color:var(--accent);font-size:.82rem;text-decoration:none;white-space:nowrap">The week &rarr;</a>
  </div>
  <p class="sub" id="sub"></p>
  <div class="barrow">
    <div class="bar"><i id="fill"></i></div>
    <span class="count" id="count">0 of 0</span>
  </div>
</header>

<details class="stock" id="stockBox" open>
  <summary>Check you have these</summary>
  <div id="staples"></div>
  <p class="stockfoot" id="stockFoot"></p>
</details>

<div id="list"></div>

<div class="add">
  <input id="new" type="text" placeholder="Add anything else…"
         autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
  <button id="addBtn">Add</button>
</div>

<div class="done" id="done">
  <strong>That's everything.</strong>
</div>


<div class="foot">
  <button id="undo" disabled>Undo</button>
  <button id="clear">Clear</button>
  <button class="share" id="share">Share</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* The list is whatever the planner last built for this week (localStorage
   `list-<week>`), or whatever a shared link carries. There is no built-in
   fallback any more: a hard-coded September list shown in October was worse
   than an honest empty page. */
let ITEMS = [];      /* [aisle, name, qty] */
let STAPLES = [];    /* [name, amount] */
let GENERATED = null;

/* Ticks are remembered by name, with the quantity they were ticked at. They
   used to be positions, so rebuilding the list or opening a link against a
   different list ticked the wrong things. A rebuilt line keeps its tick only
   if it still asks for the same amount: "2 tins" ticked never covers "3 tins". */
let got = {};         /* item name -> qty when ticked */
let pantry = {};      /* staple name -> 1 have · 2 need · 3 need+got; absent = unresolved */
let extras = [];      /* [{n, t}] */
let seenExtras = [];  /* planner extras already offered, so one you remove stays removed */
let showHave = false;
let history = [];

const $ = s => document.querySelector(s);
const ISO = /^\d{4}-\d{2}-\d{2}$/;

/* Which week. The planner opens this page as ./?w=<week>; a shared link may
   carry another. list-current is the fallback for a bare visit. */
let WEEK_ID = (function(){
  const w = new URLSearchParams(location.search).get("w");
  if (w && ISO.test(w)) return w;
  try { return localStorage.getItem("list-current") || ""; } catch(e){ return ""; }
})();
const key = () => "shop-" + WEEK_ID;

/* Seven days, Saturday to Friday, because the shop is Friday evening. Day 7 is
   found with setDate, not +6×24 hours: Sunday 25 October is 25 hours long. */
function weekLabel(id){
  if (!id || !ISO.test(id)) return "";
  const a = new Date(id + "T00:00:00"), b = new Date(a);
  b.setDate(a.getDate() + 6);
  const M = ["January","February","March","April","May","June","July","August",
             "September","October","November","December"];
  const D = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const same = a.getMonth() === b.getMonth();
  return D[a.getDay()] + " " + a.getDate() + (same ? "" : " " + M[a.getMonth()]) +
         " – " + D[b.getDay()] + " " + b.getDate() + " " + M[b.getMonth()];
}
/* "Saturday 3 – Friday 9 October" -> "3–9 Oct" */
const shortLabel = l => l.replace(/^\w+ /, "").replace(/ – \w+ /, "–")
                         .replace(/ (\w+)$/, (m, w) => " " + w.slice(0, 3));

/* ---------- the list ---------- */
function adopt(g){
  if (!g || !Array.isArray(g.items)) return false;
  ITEMS   = g.items.map(i => [String(i[0]), String(i[1]), String(i[2] || "")]);
  STAPLES = (g.staples || []).map(s => [String(s[0]), String(s[1] || "")]);
  GENERATED = g;
  return true;
}
function loadGenerated(){
  ITEMS = []; STAPLES = []; GENERATED = null;
  try {
    const raw = localStorage.getItem("list-" + WEEK_ID);
    if (raw) adopt(JSON.parse(raw));
  } catch(e){}
}
const isGot = it => got[it[1]] === it[2];

/* ---------- state ---------- */
function snap(){
  return {got: {...got}, p: {...pantry}, x: extras.map(e => [e.n, e.t]), seen: seenExtras.slice()};
}
function setState(o){
  o = o || {};
  got = (o.got && typeof o.got === "object") ? o.got : {};
  pantry = (o.p && typeof o.p === "object" && !Array.isArray(o.p)) ? o.p : {};
  extras = Array.isArray(o.x) ? o.x.map(e => ({n: String(e[0]), t: e[1] ? 1 : 0})) : [];
  seenExtras = Array.isArray(o.seen) ? o.seen.map(String) : [];
}
/* Saved state and share links from before 7 October held positions, base64'd. */
function legacy(o){
  got = {}; pantry = {};
  if (typeof o.t === "string")
    o.t.split("").forEach((c, i) => { if (c === "1" && ITEMS[i]) got[ITEMS[i][1]] = ITEMS[i][2]; });
  if (typeof o.p === "string")
    o.p.split("").forEach((c, i) => { if (+c && STAPLES[i]) pantry[STAPLES[i][0]] = +c; });
  extras = Array.isArray(o.x) ? o.x.map(e => ({n: String(e[0]), t: e[1] ? 1 : 0})) : [];
}
function save(){
  try { localStorage.setItem(key(), JSON.stringify(snap())); } catch(e){}
}
function load(){
  let s = null;
  try { s = localStorage.getItem(key()); } catch(e){}
  if (!s) return;
  try { setState(JSON.parse(s)); }
  catch(e){ try { legacy(JSON.parse(b64d(s))); } catch(e2){} }
}

/* ---------- the share link ---------- */
/* It carries the whole list, not just the ticks: the other phone may never
   have built this week, and ticks mean nothing without the lines they tick. */
function b64e(s){
  const b = new TextEncoder().encode(s); let x = "";
  b.forEach(c => x += String.fromCharCode(c));
  return btoa(x).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64d(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  const b = atob(s), a = Uint8Array.from(b, c => c.charCodeAt(0));
  return new TextDecoder().decode(a);
}
function payload(){
  return b64e(JSON.stringify({v: 2, w: WEEK_ID, built: GENERATED ? GENERATED.built : 0,
                              items: ITEMS, staples: STAPLES, ...snap()}));
}
function receive(s){
  const o = JSON.parse(b64d(s));
  if (o.v !== 2){ legacy(o); return; }
  if (o.w && ISO.test(o.w) && o.w !== WEEK_ID){ WEEK_ID = o.w; loadGenerated(); }
  if (Array.isArray(o.items)){
    adopt({weekId: WEEK_ID, built: o.built || 0, items: o.items, staples: o.staples || [],
           extras: (GENERATED && GENERATED.extras) || []});
    try {
      localStorage.setItem("list-" + WEEK_ID, JSON.stringify(GENERATED));
      localStorage.setItem("list-current", WEEK_ID);
    } catch(e){}
  }
  setState(o);
}
function cleanUrl(){
  try { window.history.replaceState(null, "", location.pathname + (WEEK_ID ? "?w=" + WEEK_ID : "")); }
  catch(e){}
}

/* Planner extras ("Fri: fish fingers") are offered once. Removing one sticks. */
function mergePlannerExtras(){
  if (!GENERATED) return;
  let changed = false;
  (GENERATED.extras || []).forEach(n => {
    if (seenExtras.includes(n)) return;
    seenExtras.push(n); changed = true;
    if (!extras.some(e => e.n.toLowerCase() === n.toLowerCase())) extras.push({n: n, t: 0});
  });
  if (changed) save();
}

/* ---------- rendering ---------- */
/* Every name and quantity goes in as text. Extras arrive typed or in a link,
   and "<" in one used to break the row (or worse). */
const TICK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderStaples(){
  const box = document.getElementById("staples");
  const foot = document.getElementById("stockFoot");
  document.getElementById("stockBox").hidden = !STAPLES.length;
  box.innerHTML = "";

  STAPLES.forEach(st => {
    const s = pantry[st[0]] || 0;
    if (s !== 0 && !(showHave && s === 1)) return;
    const d = el("div", "sp");
    const n = el("span", "n", st[0]);
    if (st[1]) n.appendChild(el("em", "", st[1]));
    d.appendChild(n);

    const have = el("button", "", s === 1 ? "In stock" : "Got it");
    have.onclick = () => { snapshot(); if (s === 1) delete pantry[st[0]]; else pantry[st[0]] = 1; commit(); };
    const need = el("button", "need", "Need it");
    need.onclick = () => { snapshot(); pantry[st[0]] = 2; commit(); toast(st[0] + " added to the list"); };
    d.appendChild(have); d.appendChild(need);
    box.appendChild(d);
  });

  const haveCount = STAPLES.filter(st => pantry[st[0]] === 1).length;
  const left = STAPLES.filter(st => !pantry[st[0]]).length;
  if (!left && !showHave) box.innerHTML = '<div class="sp"><span class="n">All checked.</span></div>';
  foot.innerHTML = haveCount
    ? haveCount + ' marked as in stock · <a href="#" id="toggleHave">' +
      (showHave ? 'hide' : 'show') + '</a>'
    : 'Tap <strong>Got it</strong> if it is in the cupboard, or <strong>Need it</strong> ' +
      'to move it onto the list.';
  const t = document.getElementById("toggleHave");
  if (t) t.onclick = e => { e.preventDefault(); showHave = !showHave; renderStaples(); };
}

function render(){
  renderStaples();
  const wrap = $("#list");
  wrap.innerHTML = "";

  if (!ITEMS.length && !STAPLES.length){
    const p = el("p", "note");
    p.innerHTML = '<strong>No list for this week yet.</strong> Open <a href="plan.html">the week</a> ' +
      'and press <strong>Build shopping list</strong>, or open a list someone has shared with you.';
    wrap.appendChild(p);
  }

  let sec = null, ul = null;
  ITEMS.forEach(it => {
    if (it[0] !== sec){
      sec = it[0];
      wrap.appendChild(el("p", "sec", sec));
      ul = el("ul"); wrap.appendChild(ul);
    }
    ul.appendChild(row(it[1], it[2], isGot(it), () => toggle(it)));
  });

  const needed = STAPLES.filter(st => (pantry[st[0]] || 0) >= 2);
  if (needed.length){
    wrap.appendChild(el("p", "sec", "Also need"));
    const list = el("ul");
    needed.forEach(st => {
      const li = row(st[0], st[1], pantry[st[0]] === 3, () => {
        snapshot(); pantry[st[0]] = pantry[st[0]] === 3 ? 2 : 3; commit(); });
      const rm = el("span", "rm", "×");
      rm.onclick = ev => { ev.stopPropagation(); snapshot(); pantry[st[0]] = 1; commit();
                           toast("Moved back to in stock"); };
      li.appendChild(rm);
      list.appendChild(li);
    });
    wrap.appendChild(list);
  }

  if (extras.length){
    wrap.appendChild(el("p", "sec", "Also"));
    const list = el("ul");
    extras.forEach((e, j) => {
      const li = row(e.n, "", e.t, () => { snapshot(); extras[j].t = extras[j].t ? 0 : 1; commit(); });
      const rm = el("span", "rm", "×");
      rm.onclick = ev => { ev.stopPropagation(); snapshot(); extras.splice(j, 1); commit(); toast("Removed"); };
      li.appendChild(rm);
      list.appendChild(li);
    });
    wrap.appendChild(list);
  }

  const total = ITEMS.length + extras.length + needed.length;
  const done = ITEMS.filter(isGot).length + extras.reduce((a, e) => a + e.t, 0) +
               needed.filter(st => pantry[st[0]] === 3).length;
  $("#count").textContent = done + " of " + total;
  $("#fill").style.width = total ? (done / total * 100) + "%" : "0%";
  $("#done").classList.toggle("show", total > 0 && done === total);
  $("#undo").disabled = history.length === 0;
}

function row(name, qty, on, fn){
  const li = el("li", on ? "on" : "");
  const box = el("span", "box"); box.innerHTML = TICK;
  const txt = el("span", "txt");
  txt.appendChild(el("span", "nm", name));
  if (qty) txt.appendChild(el("span", "qt", qty));
  li.appendChild(box); li.appendChild(txt);
  li.onclick = fn;
  return li;
}

function labels(){
  const l = weekLabel(WEEK_ID);
  $("#sub").textContent = l + (GENERATED && l ? " · built from the week" : "");
  document.title = l ? "Shopping · " + shortLabel(l) : "Shopping";
}

/* ---------- actions ---------- */
function snapshot(){
  history.push(snap());
  if (history.length > 60) history.shift();
}
function toggle(it){
  snapshot();
  if (isGot(it)) delete got[it[1]]; else got[it[1]] = it[2];
  commit();
}
function commit(){ save(); render(); }

$("#undo").onclick = () => {
  if (!history.length) return;
  setState(history.pop());
  commit(); toast("Undone");
};

$("#clear").onclick = () => {
  snapshot();
  got = {};
  extras.forEach(e => e.t = 0);
  Object.keys(pantry).forEach(k => { if (pantry[k] === 3) pantry[k] = 2; });
  commit(); toast("All unticked");
};

function addExtra(){
  const inp = $("#new");
  const v = inp.value.trim();
  if (!v) return;
  if (extras.some(e => e.n.toLowerCase() === v.toLowerCase())){
    inp.value = ""; toast("Already on the list"); return;
  }
  snapshot();
  extras.push({n: v, t: 0});
  inp.value = "";
  commit();
}
$("#addBtn").onclick = addExtra;
$("#new").addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault(); addExtra(); $("#new").blur(); }
});

/* ---------- share ---------- */
function shareUrl(){
  return location.origin + location.pathname + "?w=" + WEEK_ID + "#" + payload();
}

/* works without a secure context, unlike navigator.clipboard */
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  return ok;
}

$("#share").onclick = async () => {
  const web = location.protocol === "http:" || location.protocol === "https:";
  if (!web){
    toast("Sharing needs the online version");
    return;
  }
  if (!ITEMS.length && !STAPLES.length){
    toast("Nothing to share yet");
    return;
  }

  const url = shareUrl();
  const l = weekLabel(WEEK_ID);
  const label = "Shopping list" + (l ? " · " + shortLabel(l) : "");

  if (navigator.share){
    try {
      await navigator.share({title: label, text: label, url: url});
      return;
    } catch(e){
      if (e && e.name === "AbortError") return;   /* user cancelled */
    }
  }

  if (navigator.clipboard && window.isSecureContext){
    try {
      await navigator.clipboard.writeText(url);
      toast("Link copied — paste it into WhatsApp");
      return;
    } catch(e){}
  }

  if (legacyCopy(url)){
    toast("Link copied — paste it into WhatsApp");
    return;
  }

  window.prompt("Copy this link:", url);
};

/* ---------- toast ---------- */
let tid;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(tid);
  tid = setTimeout(() => t.classList.remove("show"), 1700);
}

/* ---------- boot ---------- */
/* A link replaces this phone's ticks with the sender's. If it is the same
   week, Undo brings this phone's own back. */
function takeLink(){
  const week = WEEK_ID, before = snap();
  try {
    receive(location.hash.slice(1));
    history = (WEEK_ID === week) ? history.concat([before]) : [];
    save();
    return true;
  } catch(e){ return false; }
  finally { cleanUrl(); }
}

(function init(){
  loadGenerated();
  load();
  const fromLink = location.hash.length > 1 && takeLink();
  mergePlannerExtras();
  labels();
  render();
  if (fromLink) toast(history.length ? "List received — Undo to go back" : "List received");
})();

/* a shared link tapped while the page is already open changes the hash
   without reloading, so nothing would happen otherwise */
window.addEventListener("hashchange", () => {
  if (location.hash.length <= 1) return;
  if (takeLink()){
    mergePlannerExtras(); labels(); render();
    toast(history.length ? "List received — Undo to go back" : "List received");
  }
});
</script>

</body>
</html>
