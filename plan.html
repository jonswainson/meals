<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>The week · 14–18 Sept</title>
<style>
  :root{--bg:#faf9f7;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e2e0dc;
    --card:#fff;--soft:#f3f1ed;--accent:#8a5a2b;--go:#3d7a4e;--hot:#a03232}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#141414;--fg:#ededed;--muted:#9a9a9a;--line:#2e2e2e;
    --card:#1c1c1c;--soft:#232323;--accent:#d9a05b;--go:#7dc48f;--hot:#e08585}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:640px;margin-inline:auto;padding:0 0 60px;-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
  .title{display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;padding:0 16px 8px}
  h1{font-size:1.1rem;margin:0;letter-spacing:-.01em}
  .title a{color:var(--accent);font-size:.82rem;text-decoration:none;white-space:nowrap}

  nav{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;
    scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;min-width:56px;font:inherit;font-size:.88rem;font-weight:600;
    padding:9px 4px;border:1px solid transparent;border-radius:9px;
    background:none;color:var(--muted);cursor:pointer}
  nav button.on{background:var(--accent);color:#fff}
  nav button.sat{color:var(--muted);font-weight:500}
  nav button.sat.on{color:#fff}

  .daybar{background:var(--soft);padding:11px 16px;font-size:.82rem;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
  .daybar b{color:var(--fg);font-variant-numeric:tabular-nums}
  .tag{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);font-weight:700}

  .meal{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin:14px 12px;padding:15px 17px}
  .slot{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:0 0 3px}
  h2{font-size:1.02rem;margin:0 0 8px;letter-spacing:-.005em}
  .macros{display:flex;gap:14px;flex-wrap:wrap;background:var(--soft);
    border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.84rem;
    font-variant-numeric:tabular-nums}
  .macros span{color:var(--muted)}
  h3{font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:14px 0 6px;font-weight:700}
  ul,ol{margin:0;padding-left:19px}
  li{margin:5px 0;font-size:.92rem}
  ol li{margin:8px 0}
  .tip{border-left:3px solid var(--accent);padding:5px 0 5px 13px;margin:12px 0 0;
    font-size:.87rem;color:var(--muted)}
  .tip strong{color:var(--fg)}
  .tip.hot{border-left-color:var(--hot)}
  .tip.go{border-left-color:var(--go)}
  .plates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  @media(max-width:460px){.plates{grid-template-columns:1fr}}
  .plate{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.87rem}
  .plate b{display:block;font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px}
  .meal.tonight{border-color:var(--go);background:var(--soft)}
  .meal.tonight .slot{color:var(--go)}
  .meal.tonight .tip{border-left-color:var(--go)}
  .free{margin:40px 16px;text-align:center;color:var(--muted);font-size:.95rem}
  .free strong{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:8px}
</style>
</head>

function card(m){
  let h = '<div class="meal' + (m.tonight ? ' tonight' : '') + '"><p class="slot">' +
    m.slot + '</p><h2>' + m.name + '</h2>';
  if (m.sub) h += '<p class="tip" style="margin:0 0 10px">' + m.sub + '</p>';
  if (m.macros) h += m.macros;
  if (m.ing) h += '<h3>Ingredients</h3><ul><li>' + m.ing.join('</li><li>') + '</li></ul>';
  if (m.method) h += '<h3>Method</h3><ol><li>' + m.method.join('</li><li>') + '</li></ol>';
  if (m.tip) h += '<p class="tip">' + m.tip + '</p>';
  if (m.tip2) h += '<p class="tip go">' + m.tip2 + '</p>';
  if (m.cheryl) h += '<p class="tip"><strong>Cheryl:</strong> ' + m.cheryl + '</p>';
  if (m.plates){
    h += '<div class="plates">';
    m.plates.forEach(p => h += '<div class="plate"><b>' + p[0] + '</b>' + p[1] + '</div>');
    h += '</div>';
  }
  return h + '</div>';
}

function show(i){
  const d = DAYS[i];
  document.querySelectorAll('#tabs button').forEach((b,j) =>
    b.classList.toggle('on', j === i));
  const el = document.getElementById('day');
  if (d.free){
    el.innerHTML = '<p class="free"><strong>Saturday isn\'t counted.</strong>' +
      'No target, no tracking, no photograph. Protein still holds as a habit — order the ' +
      'protein-heavy main and stop thinking about it.<br><br>' +
      'The risk is Sunday, not Saturday.</p>';
  } else {
    el.innerHTML = '<div class="daybar"><span class="tag">' + d.tags + '</span></div>' +
      '<div class="daybar">' + d.totals + '</div>' +
      d.meals.map(card).join('');
  }
  try { localStorage.setItem("plan-day", d.id); } catch(e){}
  window.scrollTo(0,0);
}

const nav = document.getElementById('tabs');
DAYS.forEach((d,i) => {
  const b = document.createElement('button');
  b.textContent = d.label;
  if (d.free) b.className = 'sat';
  b.onclick = () => show(i);
  nav.appendChild(b);
});

/* open on today where today is a weekday in the plan, else Monday */
(function(){
  let i = 0;
  const wd = new Date().getDay();            /* 0 Sun … 6 Sat */
  if (wd >= 1 && wd <= 6) i = wd - 1;        /* Mon=0 … Sat=5 */
  try {
    const saved = localStorage.getItem("plan-day");
    const j = DAYS.findIndex(d => d.id === saved);
    if (j > -1) i = j;
  } catch(e){}
  show(i);
})();
</script>
