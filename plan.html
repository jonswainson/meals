<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>The week · 14–18 Sept</title>
<style>
  :root{--bg:#faf9f7;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e2e0dc;
    --card:#fff;--soft:#f3f1ed;--accent:#8a5a2b;--go:#3d7a4e;--warn:#9a6a12;--hot:#a03232}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#141414;--fg:#ededed;--muted:#9a9a9a;--line:#2e2e2e;
    --card:#1c1c1c;--soft:#232323;--accent:#d9a05b;--go:#7dc48f;--warn:#e0b45b;--hot:#e08585}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:640px;margin-inline:auto;padding:0 0 100px;-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
  .title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 16px 8px}
  h1{font-size:1.1rem;margin:0;letter-spacing:-.01em}
  .title a{color:var(--accent);font-size:.82rem;text-decoration:none;white-space:nowrap}
  .flip{font:inherit;font-size:.74rem;font-weight:600;color:var(--accent);background:var(--soft);
    border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  nav{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;min-width:54px;font:inherit;font-size:.88rem;font-weight:600;
    padding:9px 4px;border:1px solid transparent;border-radius:9px;background:none;
    color:var(--muted);cursor:pointer;position:relative}
  nav button.on{background:var(--accent);color:#fff}
  nav button .dot{position:absolute;top:5px;right:7px;width:6px;height:6px;
    border-radius:50%;background:var(--warn);display:none}
  nav button.amber .dot{display:block}
  nav button.on .dot{background:#fff}

  .totals{background:var(--soft);padding:9px 16px;font-size:.83rem;
    border-bottom:1px solid var(--line)}
  .trow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
    font-variant-numeric:tabular-nums;align-items:baseline}
  .who{color:var(--muted);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase}
  .ok{color:var(--go)}.amber{color:var(--warn)}
  .fix{margin:6px 0 0;font-size:.82rem;color:var(--warn);line-height:1.45}
  .tag{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);font-weight:700;padding:11px 16px 0;display:block}

  .meal{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin:12px;padding:14px 16px}
  details.meal > summary{list-style:none;cursor:pointer;position:relative;padding-right:26px;
    user-select:none;-webkit-user-select:none}
  details.meal > summary::-webkit-details-marker{display:none}
  details.meal > summary::after{content:"";position:absolute;right:2px;top:7px;width:9px;height:9px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(45deg);transition:transform .15s ease}
  details.meal[open] > summary::after{transform:rotate(225deg)}
  details.meal > summary .macros{margin-bottom:0}
  details.meal[open] > summary .macros{margin-bottom:2px}
  /* the 2:30 is one person's, and should not look like the meals they share */
  details.meal.solo{background:none;border-style:dashed}
  details.meal.solo > summary .slot{color:var(--muted)}
  details.meal.solo > summary h2{font-weight:600;color:var(--muted)}
  .slot{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:0 0 5px}
  h2{font-size:1rem;margin:0 0 8px;letter-spacing:-.005em}
  .macros{display:flex;gap:13px;flex-wrap:wrap;background:var(--soft);border-radius:8px;
    padding:7px 11px;margin:0 0 10px;font-size:.82rem;font-variant-numeric:tabular-nums}
  .macros span{color:var(--muted)}
  select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--fg);-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
      linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .ctrl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .ctrl label{font-size:.82rem;color:var(--muted)}
  .step{display:flex;align-items:center;border:1px solid var(--line);
    border-radius:9px;overflow:hidden}
  .step button{font:inherit;font-size:1.1rem;font-weight:600;width:40px;height:40px;
    border:none;background:var(--card);color:var(--fg)}
  .step span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;
    font-size:.92rem;font-weight:600}
  .dau{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:.86rem}
  .dau input[type=checkbox]{width:20px;height:20px;accent-color:#3d7a4e;flex:0 0 auto}
  .dau input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
  .note{font-size:.82rem;color:var(--muted);margin:9px 0 0;line-height:1.45}
  .note.warn{color:var(--warn)}
  .note.prep{color:var(--go);font-weight:500}
  .ing{margin:9px 0 0;padding-left:18px;font-size:.87rem;color:var(--muted)}
  .rh{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin:13px 0 0;font-weight:700}
  .ing li{margin:3px 0}
  .ing i{font-style:normal;opacity:.7;font-size:.92em}
  .splitwrap{overflow-x:auto;margin-top:9px}
  table.split{width:100%;border-collapse:collapse;font-size:.85rem}
  table.split th,table.split td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);
    white-space:nowrap;font-variant-numeric:tabular-nums}
  table.split th:first-child,table.split td:first-child{text-align:left;white-space:normal;
    color:var(--muted);font-variant-numeric:normal}
  .ratio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px;
    padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}
  .ratio b{font-size:1.45rem;letter-spacing:.06em;color:var(--accent);
    font-variant-numeric:tabular-nums;line-height:1}
  .ratio span{font-size:.78rem;color:var(--muted)}
  table.split .pc{font-size:.7rem;color:var(--muted);font-weight:400}
  table.split tr.cooked td{border-bottom:none;color:var(--muted);padding-top:8px}
  table.split thead th{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700}
  table.split tbody td b{color:var(--fg)}
  /* No longer a disclosure - the whole meal card collapses now, so this is just a
     labelled panel. Same look as the old open state, without the chevron. */
  .more{margin-top:12px}
  .more .mhead{font-size:.9rem;color:var(--accent);font-weight:600;padding:0 14px;
    line-height:44px;min-height:44px;background:var(--soft);
    border:1px solid var(--line);border-bottom-color:transparent;border-radius:11px 11px 0 0}
  .more .body{border:1px solid var(--line);border-top:none;
    border-radius:0 0 11px 11px;padding:2px 14px 13px;background:var(--soft)}
  .more .body .rh:first-child{margin-top:11px}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
    border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));
    display:flex;gap:8px;max-width:640px;margin-inline:auto}
  .foot button{flex:1;font:inherit;font-weight:600;font-size:.92rem;padding:14px 10px;
    border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
  .foot .go{background:var(--accent);color:#fff;border-color:var(--accent);flex:1.7}
  .toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);
    background:var(--fg);color:var(--bg);font-size:.85rem;font-weight:500;padding:10px 16px;
    border-radius:99px;opacity:0;pointer-events:none;transition:all .22s;z-index:30;
    max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .free{margin:40px 16px;text-align:center;color:var(--muted);font-size:.95rem}
  .free strong{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:8px}
</style>
</head>

   lands Friday night and the first meal out of it is Saturday breakfast. Next week
   takes over on its own Saturday. Either is reachable from the header. */
const WEEKS = [DEFAULT_WEEK, WEEK_0926];
function pickWeek(){
  let i;
  try { const c = localStorage.getItem("week-choice");
        if (c !== null) i = WEEKS.findIndex(w => w.id === c); } catch(e){}
  if (i === undefined || i < 0) i = (Date.now() >= new Date(2026,8,26).getTime()) ? 1 : 0;
  return WEEKS[i];
}

});

function load(){

       if (s){ const w = JSON.parse(s); if (w && w.id === BASE.id) return w; } }catch(e){}

/* ---------- nutrition ---------- */
const ZERO = {kcal:0,protein:0,fibre:0,salt:0};
const add = (a,b) => ({kcal:a.kcal+b.kcal, protein:a.protein+b.protein,
                       fibre:a.fibre+b.fibre, salt:a.salt+b.salt});

function mealFor(d, slot, who){
  const m = d[slot];
  if (typeof m === "string"){
    const f = FIXED[m]; return (f && f[who]) ? f[who] : ZERO;
  }
  if (!m) return ZERO;

  if (m.kind === "fixed"){
    const id = (who === "cheryl" && m.cheryl) ? m.cheryl : m.id;
    const f = FIXED[id]; if (!f) return ZERO;
    let v = f[who] || ZERO;
    if (slot === "lunch" && who === "cheryl") v = add(v, CHERYL_LUNCH_ADDON);
    return v;
  }
  if (m.kind === "recipe"){
    const r = recipe(m.id); if (!r) return ZERO;
    if (who === "daughter" && !m.daughter) return ZERO;
    let v = r.plates[who] || ZERO;
    if (slot === "lunch" && who === "cheryl") v = add(v, CHERYL_LUNCH_ADDON);
    return v;
  }
  if (m.kind === "leftover"){
    const src = day(m.from);
    if (!src || !src.dinner || src.dinner.kind !== "recipe") return ZERO;
    const r = recipe(src.dinner.id); if (!r) return ZERO;
    if (who === "daughter") return ZERO;
    let v = leftoverPlate(r, who);
    if (who === "cheryl") v = add(v, CHERYL_LUNCH_ADDON);
    return v;
  }
  return ZERO;
}

/* A leftover lunch is a weighed portion of the same dish, not the dinner plate.
   recipes.json carries the weight and the macros for each person; see leftoverMethod. */
const leftoverPortion = (r, who) => ((r.leftover||{}).portions||{})[who] || null;
function leftoverPlate(r, who){
  const x = leftoverPortion(r, who);
  if (!x || x.source === "not-scalable") return r.plates[who] || ZERO;
  return x.overBand || x;   /* count what the card tells him to take */
}

const dayTotal = (d, who) => d.free ? ZERO :
  ["breakfast","lunch","afternoon","dinner"].reduce((a,s) => add(a, mealFor(d,s,who)), ZERO);

/* Something else = no numbers, so the day is reported but not judged. */
const freeSlots = d => ["breakfast","lunch","afternoon","dinner"].filter(sl => {
  const m = d[sl];
  if (typeof m === "string") return !!(FIXED[m] || {}).free;
  if (m && m.kind === "fixed") return !!(FIXED[m.id] || {}).free;
  if (m && m.kind === "recipe") return /^own-/.test(m.id);
  return false;
});

function status(d, who){
  const t = TARGETS[who], v = dayTotal(d, who), problems = [];
  if (freeSlots(d).length) return {v, problems};
  const dk = Math.round(v.kcal - t.kcal);
  if (Math.abs(dk) > t.band) problems.push({k:"kcal", d:dk});
  if (v.protein < t.protein) problems.push({k:"protein", d:Math.round((v.protein - t.protein)*10)/10});
  if (v.salt > t.salt) problems.push({k:"salt", d:Math.round((v.salt - t.salt)*10)/10});
  return {v, problems};
}

function fixLine(who, problems){
  if (!problems.length) return "";
  const bits = problems.map(p =>
    p.k === "kcal"    ? (p.d>0?"+":"") + p.d + " kcal" :
    p.k === "protein" ? p.d + "g protein" : "+" + p.d + "g salt");
  const kcal = problems.find(p => p.k === "kcal");
  const prot = problems.find(p => p.k === "protein");
  let sug = "";
  if (prot && prot.d <= -15) sug = " Close it with plain Skyr — 100g is 63 kcal and 11g.";
  else if (prot)             sug = " Under by less than 15g, which the brief says to leave alone.";
  else if (kcal && kcal.d < 0) sug = " A bigger afternoon feed is the easiest 100–200.";
  else if (kcal && kcal.d > 0) sug = " An apple at 2:30 instead, or a smaller plate.";
  return (who === "jon" ? "Jon" : "Cheryl") + ": " + bits.join(" · ") + "." + sug;
}

/* ---------- rendering ---------- */
const n1 = x => Math.round(x*10)/10;

function renderTabs(){
  const nav = $("#tabs"); nav.innerHTML = "";
  WEEK.days.forEach((d,i) => {
    const b = document.createElement("button");
    b.innerHTML = d.label + '<span class="dot"></span>';
    if (i === current) b.classList.add("on");
    if (!d.free && (status(d,"jon").problems.length || status(d,"cheryl").problems.length))
      b.classList.add("amber");
    b.onclick = () => { current = i; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
}

function renderTotals(d){
  const el = $("#totals");
  if (d.free){
    el.innerHTML = '<div class="trow"><span class="who">Saturday</span><span class="ok">Not counted</span></div>';
    return;
  }
  let h = "";
  const eating = ["jon","cheryl"].filter(w => d.diners.includes(w));
  eating.forEach(who => {
    const {v, problems} = status(d, who);
    h += '<div class="trow"><span class="who">' + (who==="jon"?"Jon":"Cheryl") + '</span>' +
      '<span class="' + (problems.length?"amber":"ok") + '"><b>' + Math.round(v.kcal) +
      '</b> kcal · <b>' + n1(v.protein) + 'g</b> protein · ' + n1(v.fibre) + 'g fibre · ' +
      n1(v.salt) + 'g salt</span></div>';
  });
  eating.forEach(who => {
    const line = fixLine(who, status(d, who).problems);
    if (line) h += '<p class="fix">' + line + '</p>';
  });
  const free = freeSlots(d);
  if (free.length)
    h += '<p class="fix">' + free.map(f => f === "afternoon" ? "2:30" : f).join(" and ") +
         ' is your own, so the day is not scored. Everything else is counted above.</p>';
  el.innerHTML = h;
}

const macroRow = (p, r) =>
  '<div class="macros"><div><b>' + Math.round(p.kcal) + '</b> <span>kcal</span></div>' +
  '<div><b>' + p.protein + 'g</b> <span>protein</span></div>' +
  '<div><b>' + p.fibre + 'g</b> <span>fibre</span></div>' +
  '<div><b>' + p.salt + 'g</b> <span>salt</span></div>' +
  (r && typeof r.timeMinutes === "number"
     ? '<div>' + (r.timeMinutes === 0
         ? '<b>No cooking</b>'
         : '<b>' + r.timeMinutes + ' min</b> <span>' +
           (r.handsOnMinutes ? r.handsOnMinutes + ' hands-on' : 'to cook') + '</span>') + '</div>'
     : '') + '</div>';

const fixedOptionsFor = (slot, sel) => (SLOT_OPTIONS[slot] || [])
  .map(id => {
    const f = FIXED[id]; if (!f) return "";
    return '<option value="' + id + '"' + (id === sel ? " selected" : "") + '>' + f.name +
      (f.jon.kcal ? ' \u2014 ' + f.jon.kcal + ' kcal, ' + f.jon.protein + 'g' : '') + '</option>';
  }).join("");

const fixedTail = (slot, sel) => (FIXED_FOR_SLOT[slot] || []).map(id => {
  const f = FIXED[id]; if (!f) return "";
  return '<option value="' + id + '"' + (id === sel ? " selected" : "") + '>' + f.name +
    (f.jon.kcal ? ' \u2014 ' + f.jon.kcal + ' kcal, ' + f.jon.protein + 'g' : '') + '</option>';
}).join("");

const optionsFor = (slot, sel) => DATA.recipes.filter(r => r.slot === slot)
  .sort((a,b) => a.name.localeCompare(b.name))
  .map(r => '<option value="' + r.id + '"' + (r.id===sel?" selected":"") + '>' +
    r.name + ' — ' + Math.round(r.plates.jon.kcal) + ' kcal, ' + r.plates.jon.protein + 'g' +
    (typeof r.timeMinutes === "number" ? ', ' + (r.timeMinutes === 0 ? "no cooking" : r.timeMinutes + ' min') : '') +
    '</option>')
  .join("");

/* No cooking at lunchtime. A lunch that needs a hob says when it gets one. */
const PREP_LABEL = {"weekend":"Weekend batch", "night-before":"Made the night before",
                    "same-day":"Nothing to cook"};
function prepBlock(r){
  const pr = r && r.prep; if (!pr) return "";
  let h = '<p class="note' + (pr.when === "same-day" ? '' : ' prep') + '"><b>' +
          (PREP_LABEL[pr.when] || pr.when) + '.</b> ' + pr.note + '</p>';
  if (pr.pan) h += '<p class="note"><b>There is a pan in this one.</b> ' + pr.pan + '</p>';
  return h;
}

/* Nothing about who eats what should have to be inferred from an absence. */
function slotNote(d, slot){
  if (!d.diners.includes("cheryl")) return "";
  if (slot === "afternoon")
    return '<p class="note"><b>Jon only.</b> Cheryl is teaching at 2:30, so her Skyr and ' +
           'banana go with her lunch instead. Nothing here for her.</p>';
  if (slot === "lunch")
    return '<p class="note"><b>Cheryl has ' + CHERYL_LUNCH_ADDON.label + ' with this</b>, ' +
           'on top of whatever the lunch is — her 2:30 feed, moved because she is teaching. ' +
           'Already counted in her figures and already on the shopping list.</p>';
  return "";
}
const closeCard = (h, d, slot) => h + slotNote(d, slot) + '</div></details>';
/* Collapsed by default: slot, name and the macro row are all you need when you are
   looking at the week. One tap gets the rest. */
const OPEN = new Set();          /* which cards the user has opened, kept across re-renders */
const cardHead = (d, slot, label, name, macros, cls) =>
  '<details class="meal' + (cls || '') + '" data-card="' + d.id + '/' + slot + '"' +
  (OPEN.has(d.id + '/' + slot) ? ' open' : '') + '><summary>' +
  '<div class="slot">' + label + '</div><h2>' + name + '</h2>' + (macros || '') +
  '</summary><div class="mbody">';

/* Jon is 1 share, Cheryl 0.75. The daughter is not modelled on the fixed items. */
const sharesFor = (d, slot) =>
  1 + (d.diners.includes("cheryl") && slot !== "afternoon" ? 0.75 : 0);

function mealCard(d, slot){
  const m = d[slot];
  const solo = slot === "afternoon" && d.diners.includes("cheryl");
  const label = (slot === "afternoon" ? "2:30" : slot[0].toUpperCase() + slot.slice(1)) +
                (solo ? ' \u2014 Jon only' : '');
  const cls = solo ? ' solo' : '';
  let h;

  if (typeof m === "string"){
    const f = FIXED[m];
    h = cardHead(d, slot, label, f.name, macroRow(f.jon, f), cls);
    if ((SLOT_OPTIONS[slot] || []).length)
      h += '<select class="fswap" data-slot="' + slot + '">' + fixedOptionsFor(slot, m) + '</select>';
    return closeCard(h + fixedRecipe(f, sharesFor(d, slot)), d, slot);
  }
  if (m.kind === "fixed"){
    const f = FIXED[m.id];
    h = cardHead(d, slot, label, f.name, macroRow(f.jon, f), cls);
    if (FIXED_FOR_SLOT[slot])
      h += '<select class="swap" data-slot="' + slot + '">' + optionsFor(slot, m.id) +
           fixedTail(slot, m.id) + '</select>';
    h += fixedRecipe(f, sharesFor(d, slot));
    if (m.cheryl) h += '<p class="note">Cheryl has the ' + FIXED[m.cheryl].name.toLowerCase() + '.</p>';
    if (f.bought) h += '<p class="note">Not cooked here — nothing for the shopping list.</p>';
    return closeCard(h, d, slot);
  }
  if (m.kind === "leftover"){
    const src = day(m.from);
    const r = (src && src.dinner.kind === "recipe") ? recipe(src.dinner.id) : null;
    h = cardHead(d, slot, label, r ? src.title + "'s " + r.name.toLowerCase() : "Leftovers",
                 r ? macroRow(leftoverPlate(r, "jon"), {timeMinutes: 0}) : "", cls);
    if (r){

      const lo = r.leftover || {};
      const pj = leftoverPortion(r, "jon"), pc = leftoverPortion(r, "cheryl");
      h += '<h3 class="rh">How much to weigh out</h3>';
      const weigh = (x, lab) => {
        if (!x) return '<li><b>' + lab + ':</b> no weight recorded — if this recipe should ' +
                       'have one, your copy of the data is stale. Reload the page.</li>';
        if (x.source === "not-scalable")
          return '<li><b>' + lab + ':</b> can\'t be weighed off this recipe — ' + x.why + '</li>';
        return '<li><b>' + lab + ' — ' + x.grams + 'g</b> · ' + x.kcal + ' kcal · ' +
               x.protein + 'g protein' + (x.source === "derived" ? ' <i>· derived</i>' : '') + '</li>';
      };
      h += '<ul class="ing">' + weigh(pj, "Jon") + weigh(pc, "Cheryl") + '</ul>';
      h += '<p class="note"><b>Cooked weights</b> \u2014 this is the finished dish, so it goes ' +
           'straight from the fridge onto the scales. No conversion.</p>';
      if (pj && pj.salt >= 2)
        h += '<p class="note warn"><b>' + pj.salt + 'g of salt in this tub</b>, against 6g for ' +
             'the day. Put it with a low-salt dinner.</p>';
      if (pj && pj.overBand)
        h += '<p class="note warn">That costed portion is <b>' + pj.kcal + ' kcal</b>, over the ' +
             '550 top of the lunch slot. <b>Take ' + pj.overBand.grams + 'g</b> instead — ' +
             pj.overBand.kcal + ' kcal, ' + pj.overBand.protein + 'g protein.</p>';
      h += '<p class="note prep"><b>Leftovers \u2014 reheat and nothing else.</b> ' +
           'The cooking was done on ' + (src ? src.label : 'the night it was made') + '.</p>';
      if (lo.note) h += '<p class="note">' + lo.note + '</p>';

      const eaten = src.diners.filter(p => p !== "daughter" || src.dinner.daughter).length;
      const left  = src.dinner.portions - eaten;
      const need  = d.diners.filter(p => p !== "daughter").length;
      h += '<p class="note' + (left < need ? " warn" : "") + '">' +
        r.name + ' makes ' + src.dinner.portions + ' · ' + eaten + ' eaten on ' + src.label +
        ' · <b>' + left + ' left</b>, and this needs ' + need + '.' +
        (left < need ? ' <b>Not enough — raise ' + src.label + "'s portions.</b>" : '') + '</p>';
    }
    h += '<p class="note">Follows whatever ' + (src ? src.label : "that day") + "'s dinner ends up being.</p>";
    return closeCard(h, d, slot);
  }

  const r = recipe(m.id);
  h = cardHead(d, slot, label, r ? r.name : "\u2014", r ? macroRow(r.plates.jon, r) : "", cls);
  h += '<select class="swap" data-slot="' + slot + '">' + optionsFor(slot, m.id) +
       fixedTail(slot, m.id) + '</select>';
  h += '<div class="ctrl"><label>Portions</label><div class="step">' +
       '<button class="dec" data-slot="' + slot + '">−</button><span>' + m.portions + '</span>' +
       '<button class="inc" data-slot="' + slot + '">+</button></div>' +
       (r ? '<label style="margin-left:auto">recipe makes ' + r.basePortions + '</label>' : '') +
       '</div>';

  if (d.diners.includes("daughter") && r && r.plates.daughter){
    h += '<div class="dau"><input type="checkbox" id="dau-' + slot + '"' +
         (m.daughter ? " checked" : "") + '><label for="dau-' + slot + '">Daughter eating this</label></div>';
    if (!m.daughter)
      h += '<div class="dau"><input type="text" class="alt" data-slot="' + slot + '" ' +
           'placeholder="Something else for her — goes on the list" value="' +
           String(m.alt||"").replace(/"/g,"&quot;") + '"></div>';
  }
  if (r && r.plates.jon && r.plates.jon.assumed)
    h += '<p class="note warn">Jon\'s plate here is <b>derived, not tested</b> — treat the numbers as an estimate.</p>';
  if (d.diners.includes("daughter") && r && r.plates.daughter && r.plates.daughter.assumed)
    h += '<p class="note warn">Your daughter\'s plate is <b>derived and never tested</b> — nobody has built one for this meal.</p>';
  if (d.diners.includes("daughter") && r && !r.plates.daughter)
    h += '<p class="note">Not a family meal — nothing here for your daughter.</p>';
  if (r && (r.warnings||[]).length)
    h += r.warnings.map(w => '<p class="note warn">' + w + '</p>').join("");
  if (r && r.secondPanForDaughter)
    h += '<p class="note warn"><b>Needs a second pan for her.</b> The brief says that has to be earned.</p>';
  if (r && r.plates.jon.plateGrams > 750)
    h += '<p class="note warn"><b>' + r.plates.jon.plateGrams + 'g on the plate</b>, against a tested ceiling of 750.</p>';
  if (r && r.plates.jon.salt >= 3)
    h += '<p class="note warn"><b>' + r.plates.jon.salt + 'g of salt in one plate</b>, against 6g for the day.</p>';
  if (r){
    const hasMethod = (r.method||[]).length > 0;
    h += '<div class="more"><div class="mhead">' +
         (hasMethod ? 'Recipe, ingredients and plates' : 'Ingredients and plates') +
         '</div><div class="body">';
    if (r.plateSpec){
      h += '<h3 class="rh">The plates</h3><ul class="ing">';
      [["jon","Yours"],["cheryl","Cheryl"],["daughter","Your daughter"]].forEach(([k,lab]) => {
        if (r.plateSpec[k]) h += '<li><b>' + lab + ':</b> ' + r.plateSpec[k] + '</li>';
      });
      h += '</ul>';
      if (r.plateSpec.note) h += '<p class="note">' + r.plateSpec.note + '</p>';
    }
    if (slot === "lunch") h += prepBlock(r);
    h += splitBlock(r, d.diners.includes("daughter") && m.daughter);

    /* the list has to be what THIS cook needs, not what the recipe's base batch needs */
    const sc = m.portions / r.basePortions;
    const amt = g => { const v = g * sc; return v >= 10 ? Math.round(v) : Math.round(v*10)/10; };
    h += '<h3 class="rh">Ingredients</h3>' +
      (sc !== 1 ? '<p class="note">Scaled to <b>' + m.portions + ' portion' +
        (m.portions === 1 ? '' : 's') + '</b> \u2014 the recipe is written for ' + r.basePortions +
        '. The method scales with it.</p>' : '') +
      '<ul class="ing"><li>' +
      r.ingredients.map(i => i.item + ' — ' + amt(i.grams) + (i.packUnit === "ml" ? "ml" : "g") +
        state(i) + (i.note ? ', ' + i.note : '') +
        (i.assumed ? ' <i>· quantity estimated</i>' : '')).join('</li><li>') + '</li></ul>';
    if ((r.method||[]).length){
      /* {{n}} marks a quantity that belongs to this batch. Day totals, per-100g rates and
         per-portion figures are left as bare numbers and never scale. */
      const meth = r.method.map(t =>
        t.replace(/\{\{([\d.]+)\}\}/g, (_, v) => amt(parseFloat(v))));
      h += '<h3 class="rh">Method</h3><ol class="ing"><li>' + meth.join('</li><li>') + '</li></ol>';
    }
    (r.tips||[]).forEach(t => {
      const cls = t.tone === "hot" ? " warn" : "";
      h += '<p class="note' + cls + '">' + t.text + '</p>';
    });
    h += '</div></div>';
  }

  return closeCard(h, d, slot);
}

/* One recipe, one ratio. Jon is one share, Cheryl three-quarters of one. If they are
   both having it, the mix is made once at 1.75 shares and poured 4:3. */
function fixedRecipe(f, shares){
  const r = f.recipe; if (!r) return "";
  let h = "";
  if (f.mix){
    const n = shares || 1;
    h += '<h3 class="rh">' + (n > 1 ? 'Make this much' : 'Ingredients') + '</h3><ul class="ing"><li>' +
      f.mix.map(([item, g, unit]) => {
        const v = g * n;
        return item + ' \u2014 ' + (v >= 10 ? Math.round(v) : Math.round(v*10)/10) + (unit || 'g');
      }).join('</li><li>') + '</li></ul>';
    if (n > 1)
      h += '<p class="note"><b>One lot, poured 4 : 3.</b> The bigger one is Jon\'s. ' +
           'Nothing is made twice.</p>';
  } else if (r.ing && r.ing.length)
    h += '<h3 class="rh">Ingredients</h3><ul class="ing"><li>' + r.ing.join('</li><li>') + '</li></ul>';
  if (r.method && r.method.length)
    h += '<h3 class="rh">Method</h3><ol class="ing"><li>' + r.method.join('</li><li>') + '</li></ol>';
  if (r.note)   h += '<p class="note">' + r.note + '</p>';
  if (r.cheryl) h += '<p class="note"><b>Cheryl:</b> ' + r.cheryl + '</p>';
  return h;
}

/* Who gets how much. One-pot dishes are served by weight out of the pan; assembled
   ones are split component by component. Derived rows are marked - see plateSplit. */
/* The rule, not a best fit: Jon is 4, Cheryl is 3 — she has three-quarters of whatever he
   has, always. Only the daughter's share moves, and it rounds against Jon's 4. Keeping the
   first two numbers fixed is the whole point: there is one ratio to remember, not thirty-four. */
function ratioOf(vals){
  if (!vals.length) return null;
  const rr = [4];
  if (vals.length > 1) rr.push(3);                                  /* Cheryl, by the rule */
  for (let i = 2; i < vals.length; i++)                             /* the daughter */
    rr.push(Math.max(1, Math.round(vals[i] / vals[0] * 4)));
  return {rr, n: rr.reduce((x,y) => x+y, 0)};
}

function splitBlock(r, eats){
  const s = r.plateSplit; if (!s) return "";
  const who = [["jon","Jon"],["cheryl","Cheryl"],["daughter","Daughter"]]
    .filter(([k]) => s.grams[k] !== undefined && (k !== "daughter" || eats));
  if (!who.length) return "";
  let h = '<h3 class="rh">How much each</h3>';
  const rat = ratioOf(who.map(([k]) => s.grams[k]));
  if (rat)
    h += '<div class="ratio"><b>' + rat.rr.join(' : ') + '</b>' +
         '<span>' + who.map(([,lab]) => lab.toLowerCase()).join(' &middot; ') +
         '</span></div><p class="note">Eyeball it in those proportions \u2014 no scales, no sums. ' +
         'It runs Jon slightly generous, so <b>weigh his plate on a tight day</b> and share the ' +
         'rest out by eye. The weights below are the exact version.</p>';
  if (s.servedByWeight){
    h += '<ul class="ing"><li>' + who.map(([k,lab]) =>
      '<b>' + lab + ' \u2014 ' + s.grams[k] + 'g</b> onto the plate').join('</li><li>') + '</li></ul>';
    return h + '<p class="note">Served as one thing \u2014 weigh the plate rather than counting ' +
           'components. Where the recipe adds bread or a spoon of something alongside, that is ' +
           'inside these weights.</p>';
  }
  if (!(s.components || []).length) return "";   /* the plates block above already spells it out */
  h += '<div class="splitwrap"><table class="split"><thead><tr><th></th>' +
       who.map(([,lab]) => '<th>' + lab + '</th>').join('') + '</tr></thead><tbody>';
  const odd = [];
  s.components.forEach(c => {
    const tot = who.reduce((a,[k]) => a + (c[k]||0), 0) || 1;
    if (rat && who.some(([k],i) => Math.abs((c[k]||0)/tot - rat.rr[i]/rat.n) > 0.12))
      odd.push(c.item.split(",")[0].toLowerCase());
    h += '<tr><td>' + c.item.split(",")[0] + '</td>' +
         who.map(([k]) => '<td>' + (c[k] ? '<b>' + c[k] + '</b>g' : '\u2014') + '</td>').join('') +
         '</tr>';
  });
  h += '<tr class="cooked"><td>On the plate, finished</td>' + who.map(([k]) =>
         '<td>' + s.grams[k] + 'g</td>').join('') + '</tr></tbody></table></div>';
  const src = s.source === "ratio"
    ? '. <b>One recipe, one ratio</b> \u2014 every ingredient splits the same way, so nothing is ' +
      'cooked twice and nobody gets a different version.'
    : '.';
  if (odd.length)
    h += '<p class="note warn"><b>The ratio does not fit the ' + odd.join(' or the ') +
         '</b> \u2014 use the row above for that one.</p>';
  h += '<p class="note"><b>The gram figures are the ingredient list\'s own</b> \u2014 raw, dry or ' +
       'drained, whichever that line says. If the dish gets cooked, weigh them before it does or ' +
       'use the ratio afterwards: proportions survive the pan, weights do not. Cold tubs need ' +
       'neither \u2014 what you weigh in is what you eat. The bottom row is the finished plate' +
       src + '</p>';
  return h;
}

/* standing rule 8: every weight is raw and dry unless it says otherwise */
function state(i){
  if (i.cooked) return ' <i>cooked</i>';
  if (i.aisle === "meat-fish") return ' <i>raw</i>';
  if (/pasta|rice|lentil|oats|bulgur|barley|couscous|quinoa|breadcrumb/i.test(i.item))
    return ' <i>dry</i>';
  return "";
}

function render(){
  /* remember what is open before the DOM is replaced */
  document.querySelectorAll("details.meal").forEach(el => {
    if (el.open) OPEN.add(el.dataset.card); else OPEN.delete(el.dataset.card);
  });
  const d = WEEK.days[current];
  renderTabs(); renderTotals(d);
  const el = $("#day");
  if (d.free){
    el.innerHTML = '<p class="free"><strong>Saturday isn\'t counted.</strong>' +
      'No target, no tracking, no photograph. Protein still holds as a habit.<br><br>' +
      'The risk is Sunday, not Saturday.</p>';
    return;
  }
  el.innerHTML = '<span class="tag">' + d.tags + '</span>' +
    ["breakfast","lunch","afternoon","dinner"].map(s => mealCard(d, s)).join("");
  wire(d);
}

function wire(d){
  document.querySelectorAll("select.fswap").forEach(sel => {
    sel.onchange = () => {
      const slot = sel.dataset.slot, id = sel.value;
      d[slot] = id;
      let also = 0;
      if (slot === "breakfast" && SMOOTHIES.includes(id) && SMOOTHIE_DAYS.includes(d.id))
        SMOOTHIE_DAYS.forEach(k => {
          const o = day(k);
          if (o && o !== d && typeof o.breakfast === "string" &&
              SMOOTHIES.includes(o.breakfast) && o.breakfast !== id){ o.breakfast = id; also++; }
        });
      save(); render();
      toast(FIXED[id].name + " in" + (also ? " \u2014 and on " + also +
            " other smoothie morning" + (also > 1 ? "s" : "") : ""));
    };
  });
  document.querySelectorAll("select.swap").forEach(sel => {
    sel.onchange = () => {
      const slot = sel.dataset.slot, id = sel.value;
      if (FIXED[id]){                      /* the roast, the bought ones */
        d[slot] = {kind:"fixed", id};
        save(); render(); toast(FIXED[id].name + " in");
        return;
      }
      const r = recipe(id), was = d[slot];
      const m = (was && was.kind === "recipe") ? was
              : {kind:"recipe", id, portions:1, daughter:false, alt:""};
      m.id = id; d[slot] = m;
      const diners = d.diners.filter(p => p !== "daughter" || m.daughter).length;
      if (m.portions < diners) m.portions = diners;
      save(); render(); toast(r.name + " in");
    };
  });
  document.querySelectorAll(".step button").forEach(b => {
    b.onclick = () => {
      const m = d[b.dataset.slot];
      m.portions = Math.max(1, Math.min(12, m.portions + (b.classList.contains("inc") ? 1 : -1)));
      save(); render();
    };
  });
  document.querySelectorAll('.dau input[type=checkbox]').forEach(c => {
    c.onchange = () => { d[c.id.replace("dau-","")].daughter = c.checked; save(); render(); };
  });
  document.querySelectorAll("input.alt").forEach(t => {
    t.oninput = () => { d[t.dataset.slot].alt = t.value; save(); };
  });
}

/* ---------- shopping list ---------- */
function buildList(){
  const agg = {}, extras = [];
  const take = (list, scale) => (list||[]).forEach(i => {
    const k = i.item + "|" + (i.packUnit || "g");
    if (!agg[k]) agg[k] = {item:i.item, grams:0, aisle:i.aisle || "cupboard",
                           packSize:i.packSize || null, unit:i.packUnit || "g",
                           staple:!!i.staple, assumed:!!i.assumed};
    agg[k].grams += i.grams * scale;
    if (i.assumed) agg[k].assumed = true;
  });

  WEEK.days.forEach(d => {
    if (d.free) return;

    /* breakfasts, afternoon feeds and the roast accompaniments */
    ["breakfast","afternoon","lunch","dinner"].forEach(slot => {
      const m = d[slot];
      const f = (typeof m === "string") ? FIXED[m]
              : (m && m.kind === "fixed") ? FIXED[m.id] : null;

      /* Cheryl's own version of this slot, if she has one */
      const ov = (m && m.kind === "fixed" && m.cheryl) ? FIXED[m.cheryl] : null;
      if (ov && ov.ing && d.diners.includes("cheryl")) take(ov.ing.cheryl, 1);

      if (!f || !f.ing) return;
      if (d.diners.includes("jon")) take(f.ing.jon, 1);
      if (d.diners.includes("cheryl") && !ov) take(f.ing.cheryl, 1);
      take(f.ing.household, 1);
    });

    /* Cheryl's lunchtime Skyr, on every day she has a lunch */
    if (d.diners.includes("cheryl") && d.lunch) take(CHERYL_LUNCH_ING, 1);
    ["lunch","dinner"].forEach(slot => {
      const m = d[slot];
      if (!m || m.kind !== "recipe") return;
      const r = recipe(m.id); if (!r) return;
      const scale = m.portions / r.basePortions;
      take(r.ingredients, scale);
      if (!m.daughter && String(m.alt || "").trim())
        extras.push(d.label + ": " + m.alt.trim());
    });
  });

  const order = DATA.aisles || ["fresh","meat-fish","dairy","cupboard","frozen","bakery"];
  const names = {fresh:"Fresh", "meat-fish":"Meat & fish", dairy:"Dairy",
                 cupboard:"Cupboard", frozen:"Frozen", bakery:"Bakery"};
  const items = [], staples = [];

  Object.values(agg).forEach(a => {
    const g = Math.ceil(a.grams);
    let qty;
    if (a.packSize){
      const packs = Math.ceil(g / a.packSize);
      qty = packs + " × " + a.packSize + a.unit;
      if (packs * a.packSize > g) qty += " · need " + g + a.unit;
    } else qty = g + a.unit;
    if (a.assumed) qty += " · estimated";

    /* only small cupboard quantities stay in the check-you-have strip */
    const bulk = a.packSize ? g > a.packSize : g > 200;
    if (a.staple && a.aisle === "cupboard" && !bulk) staples.push([a.item, g + a.unit]);
    else items.push([names[a.aisle] || "Cupboard", a.item, qty, order.indexOf(a.aisle)]);
  });

  items.sort((x,y) => (x[3] - y[3]) || x[1].localeCompare(y[1]));
  staples.sort((x,y) => x[0].localeCompare(y[0]));

  return {weekId:WEEK.id, built:Date.now(),
          items:items.map(i => [i[0], i[1], i[2]]), staples, extras};
}

$("#build").onclick = () => {
  const list = buildList();
  try { localStorage.setItem("list-" + WEEK.id, JSON.stringify(list));
        localStorage.setItem("list-current", WEEK.id); } catch(e){}
  toast(list.items.length + " items — opening the list");
  setTimeout(() => { location.href = "./?w=" + WEEK.id; }, 650);
};

$("#reset").onclick = () => {
  if (!confirm("Put the week back to the original plan? Swaps and portions are lost.")) return;
  WEEK = clone(DEFAULT_WEEK); save(); render(); toast("Week reset");
};

let tid;
function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- boot ---------- */
/* no-cache forces a revalidation: without it a phone that has the page open keeps an
   old recipes.json and silently falls back to stale figures. */
fetch("recipes.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  DATA = d;
  DATA.recipes = DATA.recipes.concat([freeMeal("lunch"), freeMeal("dinner")]);
  BASE = pickWeek(); KEY = "plan-" + BASE.id; WEEK = load();

  /* "today" only means something on the week that actually contains today, and the
     week no longer starts on Monday, so find the day by its id rather than by index */
  const start = new Date(BASE.id + "T00:00:00");
  const days  = Math.floor((Date.now() - start.getTime()) / 86400000);
  const ID    = ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];
  TODAY = (days >= 0 && days < 7) ? WEEK.days.findIndex(x => x.id === ID) : -1;
  current = TODAY < 0 ? 0 : TODAY;

  const other = WEEKS[WEEKS.indexOf(BASE) === 0 ? 1 : 0];
  $("#wk").textContent = BASE.label;   /* the range is the identity; it must fit one line */
  document.title = "The week \u00b7 " + BASE.label;
  $("#flip").textContent = other.label + " →";
  $("#flip").onclick = () => {
    try { localStorage.setItem("week-choice", other.id); } catch(e){}
    location.reload();
  };
  render();
}).catch(err => {
  /* this used to swallow programming errors as "check your connection" */
  console.error("planner boot failed:", err);
  $("#day").innerHTML = '<p class="free"><strong>Couldn\'t load the week.</strong>' +
    'Check the connection and reload. If it keeps happening the page is broken, ' +
    'not your signal \u2014 the console says which.</p>';
});
</script>
