<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>The week · 14–18 Sept</title>
<style>
  :root{--bg:#faf9f7;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e2e0dc;
    --card:#fff;--soft:#f3f1ed;--accent:#8a5a2b;--go:#3d7a4e;--warn:#9a6a12;--hot:#a03232}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#141414;--fg:#ededed;--muted:#9a9a9a;--line:#2e2e2e;
    --card:#1c1c1c;--soft:#232323;--accent:#d9a05b;--go:#7dc48f;--warn:#e0b45b;--hot:#e08585}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:640px;margin-inline:auto;padding:0 0 100px;-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
  /* Pinning the one-line summary is worth 137px. Pinning the opened detail is not —
     while it is open the header scrolls away like anything else. */
  body.totals-open header{position:static}
  .title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 16px 8px}
  h1{font-size:1.1rem;margin:0;letter-spacing:-.01em}
  .title a{color:var(--accent);font-size:.82rem;text-decoration:none;white-space:nowrap}
  .flip{font:inherit;font-size:.74rem;font-weight:600;color:var(--accent);background:var(--soft);
    border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;white-space:nowrap}
  nav{display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;min-width:54px;font:inherit;font-size:.88rem;font-weight:600;
    padding:9px 4px;border:1px solid transparent;border-radius:9px;background:none;
    color:var(--muted);cursor:pointer;position:relative}
  nav button.on{background:var(--accent);color:#fff}
  nav button .dot{position:absolute;top:5px;right:7px;width:6px;height:6px;
    border-radius:50%;background:var(--warn);display:none}
  nav button.amber .dot{display:block}
  nav button.on .dot{background:#fff}

  /* One line pinned; the detail is a tap away. The header was eating half the
     screen and the recipes are what you actually stand at the hob reading. */
  .totals{background:var(--soft);font-size:.83rem;border-bottom:1px solid var(--line)}
  .totals>summary{display:block;list-style:none;position:relative;cursor:pointer;
    padding:9px 36px 9px 16px;-webkit-tap-highlight-color:transparent}
  .totals>summary::-webkit-details-marker{display:none}
  .totals>summary::after{content:"";position:absolute;right:17px;top:50%;
    width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);transform:rotate(45deg)}
  .totals[open]>summary::after{transform:rotate(-135deg);margin-top:-2px}
  .tsum{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-variant-numeric:tabular-nums}
  .tsum .sep{color:var(--muted)}
  .tsum .flag{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--warn);margin-left:7px;vertical-align:.1em}
  .tbody{padding:0 16px 10px}
  .wk{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  .trow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
    font-variant-numeric:tabular-nums;align-items:baseline}
  .who{color:var(--muted);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase}
  .ok{color:var(--go)}.amber{color:var(--warn)}
  .cnt{color:var(--muted);font-size:.85em;white-space:nowrap}
  .fix{margin:6px 0 0;font-size:.82rem;color:var(--warn);line-height:1.45}
  .tag{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);font-weight:700;padding:11px 16px 0;display:block}

  .meal{background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin:12px;padding:14px 16px}
  details.meal > summary{list-style:none;cursor:pointer;position:relative;padding-right:26px;
    user-select:none;-webkit-user-select:none}
  details.meal > summary::-webkit-details-marker{display:none}
  details.meal > summary::after{content:"";position:absolute;right:2px;top:7px;width:9px;height:9px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(45deg);transition:transform .15s ease}
  details.meal[open] > summary::after{transform:rotate(225deg)}
  details.meal > summary .macros{margin-bottom:0}
  details.meal[open] > summary .macros{margin-bottom:2px}
  /* the 2:30 is one person's, and should not look like the meals they share */
  details.meal.solo{background:none;border-style:dashed}
  details.meal.solo > summary .slot{color:var(--muted)}
  details.meal.solo > summary h2{font-weight:600;color:var(--muted)}
  .slot{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:0 0 5px}
  h2{font-size:1rem;margin:0 0 8px;letter-spacing:-.005em}
  .macros{display:flex;gap:13px;flex-wrap:wrap;background:var(--soft);border-radius:8px;
    padding:7px 11px;margin:0 0 10px;font-size:.82rem;font-variant-numeric:tabular-nums}
  .macros span{color:var(--muted)}
  select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--fg);-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
      linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .ctrl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .ctrl label{font-size:.82rem;color:var(--muted)}
  .step{display:flex;align-items:center;border:1px solid var(--line);
    border-radius:9px;overflow:hidden}
  .step button{font:inherit;font-size:1.1rem;font-weight:600;width:40px;height:40px;
    border:none;background:var(--card);color:var(--fg)}
  .step span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;
    font-size:.92rem;font-weight:600}
  .dau{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:.86rem}
  .dau input[type=checkbox]{width:20px;height:20px;accent-color:#3d7a4e;flex:0 0 auto}
  .dau input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
  .note{font-size:.82rem;color:var(--muted);margin:9px 0 0;line-height:1.45}
  .note.warn{color:var(--warn)}
  .note.prep{color:var(--go);font-weight:500}
  .ing{margin:9px 0 0;padding-left:18px;font-size:.87rem;color:var(--muted)}
  .rh{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    margin:13px 0 0;font-weight:700}
  .ing li{margin:3px 0}
  .ing i{font-style:normal;opacity:.7;font-size:.92em}
  .splitwrap{overflow-x:auto;margin-top:9px}
  table.split{width:100%;border-collapse:collapse;font-size:.85rem}
  table.split th,table.split td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);
    white-space:nowrap;font-variant-numeric:tabular-nums}
  table.split th:first-child,table.split td:first-child{text-align:left;white-space:normal;
    color:var(--muted);font-variant-numeric:normal}
  .ratio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px;
    padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}
  .ratio b{font-size:1.45rem;letter-spacing:.06em;color:var(--accent);
    font-variant-numeric:tabular-nums;line-height:1}
  .ratio span{font-size:.78rem;color:var(--muted)}
  table.split .pc{font-size:.7rem;color:var(--muted);font-weight:400}
  table.split tr.cooked td{border-bottom:none;color:var(--muted);padding-top:8px}
  table.split thead th{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700}
  table.split tbody td b{color:var(--fg)}
  /* No longer a disclosure - the whole meal card collapses now, so this is just a
     labelled panel. Same look as the old open state, without the chevron. */
  .more{margin-top:12px}
  .more .mhead{font-size:.9rem;color:var(--accent);font-weight:600;padding:0 14px;
    line-height:44px;min-height:44px;background:var(--soft);
    border:1px solid var(--line);border-bottom-color:transparent;border-radius:11px 11px 0 0}
  .more .body{border:1px solid var(--line);border-top:none;
    border-radius:0 0 11px 11px;padding:2px 14px 13px;background:var(--soft)}
  .more .body .rh:first-child{margin-top:11px}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);
    border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));
    display:flex;gap:8px;max-width:640px;margin-inline:auto}
  .foot button{flex:1;font:inherit;font-weight:600;font-size:.92rem;padding:14px 10px;
    border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
  .foot .go{background:var(--accent);color:#fff;border-color:var(--accent);flex:1.7}
  .toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);
    background:var(--fg);color:var(--bg);font-size:.85rem;font-weight:500;padding:10px 16px;
    border-radius:99px;opacity:0;pointer-events:none;transition:all .22s;z-index:30;
    max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .free{margin:40px 16px;text-align:center;color:var(--muted);font-size:.95rem}
  .free strong{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:8px}
</style>
</head>
<body>

<header>
  <div class="title">
    <h1 id="wk">The week</h1>
    <button id="flip" class="flip"></button>
    <a href="./">Shopping list →</a>
  </div>
  <nav id="tabs"></nav>
  <details class="totals" id="totals"></details>
</header>

<div id="day"></div>

<div class="foot">
  <button id="reset">Reset</button>
  <button class="go" id="build">Build shopping list</button>
</div>
<div class="toast" id="toast"></div>

Object.entries({"berry-oat":3,"skyr-bowl":3,"cherry-berry":5,"almond-blueberry":5,"pb-banana-oats":12,"gingerbread":5,"bacon-cottage":10,"milbona":0,"huel-milbona":0,"banana-skyr":1,

/* Cheryl's Skyr moved into lunch — she's teaching at 2:30 */
/* Her 2:30 feed, moved into lunch because she teaches. 100g Skyr + 40g banana -

/* Breakfasts and afternoon feeds were the only slots with no way to change them. */

const SMOOTHIE_DAYS = ["mon","wed","fri"];
const SMOOTHIES = ["berry-oat","cherry-berry","gingerbread","almond-blueberry"];

const SLOT_OPTIONS = {
  breakfast: ["berry-oat","cherry-berry","gingerbread","almond-blueberry","bacon-cottage",
              "pb-banana-oats","skyr-bowl",

};

/* Coach ruling, 19 September: THE TARGET IS WEEKLY. Six counted days at 1,900 plus a

   planner kept reporting as an overage was the cheat meal, and it was always budgeted.
   weekKcal is what the week is scored against; kcal is still the daily one. */
const TARGETS = {
  jon:    {kcal:1900, band:50, protein:170, salt:6, cheatKcal:2400, weekBand:350, fibre:25},
  cheryl: {kcal:1400, band:80, protein:110, salt:6, cheatKcal:1800, weekBand:300, fibre:22}

/* ---------- the week ---------- */
const DEFAULT_WEEK = {

  label:"19\u201325 Sept",

    {id:"tue",label:"Tue",title:"Tuesday",tags:"London \u00b7 05:15\u201322:15 \u00b7 Jon only",

/* The week runs Saturday to Friday, because the shop is Friday evening: the food
   lands Friday night and the first meal out of it is Saturday breakfast. Next week
   takes over on its own Saturday. Either is reachable from the header. */
const WEEKS = [DEFAULT_WEEK, WEEK_0926];
function pickWeek(){
  let i;
  try { const c = localStorage.getItem("week-choice");
        if (c !== null) i = WEEKS.findIndex(w => w.id === c); } catch(e){}
  if (i === undefined || i < 0) i = (Date.now() >= new Date(2026,8,26).getTime()) ? 1 : 0;
  return WEEKS[i];
}

  "Two eggs is roughly 294mg of choline, 22\u00b5g of selenium and 50\u00b5g of iodine.");

FIXED["biltong-apple"].recipe = R(
  ["25g biltong","150g apple, weighed with the core out","10g walnuts — about four halves"],
  [],
  null,
  "<b>No fridge, no cold pack, no plan</b> — this is the one that survives a rucksack. " +
  "<b>Weigh the walnuts:</b> four whole ones is 25g and 172 calories.<br><br>" +
  "<b>0.94g of salt</b> and it is the biltong — cured meat, around 3.7g per 100g. " +
  "What you get for it is 50g of protein per 100g.");

FIXED["prawns-pear"].recipe = R(
  ["150g M&S cooked king prawns","1 large pear"], [],
  null,
  "<b>Buy the prawns at King's Cross on the way to the train, not with lunch</b> — cooked prawns shouldn't sit unrefrigerated for hours. This replaces the 2:30 snack; it isn't an extra.");

FIXED["work-pizza"].recipe = R(
  ["Three slices, meat-topped"], [],
  null,
  "<b>Take the meat slices and skip the garlic bread.</b> These figures are an estimate: three slices of a 12-inch meat pizza.");

/* ---------- state ---------- */
let DATA=null, WEEK=null, current=0, TODAY=0;
let BASE = DEFAULT_WEEK, KEY = "plan-" + DEFAULT_WEEK.id;
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const recipe = id => DATA.recipes.find(r => r.id === id);
/* "our own thing" needs to be pickable in the recipe slots too, and swappable back out,
   so it goes in as a real entry with nothing in it rather than a special case. */
const ZEROPLATE = {kcal:0,protein:0,fibre:0,salt:0,plateGrams:0};
/* Monday is the same joint reheated, so it follows Sunday rather than holding its own
   figures. Pick lamb on Sunday and Monday is lamb. */
/* Monday's "off Sunday's joint" resolves to whichever joint Sunday is actually cooking. */
/* Monday inherits Sunday's joint - except the ham, whose leftovers are frozen rather than
   eaten the next day (coach ruling 3.1). Following it would land the salt twice. */
const followRoast = id => {
  if (id !== "sunday-roast") return id;
  const r = roastOn("sun");
  return (r && !(FIXED[r] || {}).noLeftoverLunch) ? r : id;
};

function roastOn(dayId){
  const dd = WEEK && WEEK.days && WEEK.days.find(x => x.id === dayId);
  const m = dd && dd.dinner;
  return (m && m.kind === "fixed" && /^roast-/.test(m.id)) ? m.id : null;
}
const freeMeal = slot => ({
  id:"own-" + slot, name:"Something else \u2014 our own thing", slot, free:true,
  basePortions:1, timeMinutes:0, tags:["free"], ingredients:[], method:[], tips:[],
  plates:{jon:ZEROPLATE, cheryl:ZEROPLATE, daughter:null},
  plateSplit:{servedByWeight:true, grams:{}},
  leftover:{leavesLunch:false}
});
const day = id => WEEK.days.find(d => d.id === id);

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(WEEK)); }catch(e){} }
function load(){
  try{ const s = localStorage.getItem(KEY);
       if (s){ const w = JSON.parse(s); if (w && w.id === BASE.id) return heal(w); } }catch(e){}
  return clone(BASE);
}

/* A saved plan on someone's phone can point at an id that has since been renamed or
   removed - roast-sunday became six joints, for one. Anything unrecognised falls back
   to what the week ships with rather than rendering an undefined meal. */
function heal(w){
  const base = {}; BASE.days.forEach(d => base[d.id] = d);
  let fixed = 0;
  w.days.forEach(d => {
    const b = base[d.id]; if (!b) return;
    ["breakfast","lunch","afternoon","dinner"].forEach(sl => {
      const m = d[sl];
      const bad =
        (typeof m === "string" && !FIXED[m]) ||
        (m && m.kind === "fixed"  && !FIXED[m.id]) ||
        (m && m.kind === "recipe" && !recipe(m.id)) ||
        (m && m.kind === "leftover" && !w.days.some(x => x.id === m.from));
      if (bad){ d[sl] = clone(b[sl]); fixed++; return; }
      if (m && m.wasFrom && !w.days.some(x => x.id === m.wasFrom)) delete m.wasFrom;
    });
  });
  if (fixed) console.warn("healed " + fixed + " stale meal reference(s) in the saved plan");
  return w;
}

/* ---------- nutrition ---------- */
const ZERO = {kcal:0,protein:0,fibre:0,salt:0};
const add = (a,b) => ({kcal:a.kcal+b.kcal, protein:a.protein+b.protein,
                       fibre:a.fibre+b.fibre, salt:a.salt+b.salt});

function mealFor(d, slot, who){
  /* Coach ruling 3.4: she is never scored. Her plates carry weights and no macros at all,
     so this has to return before anything tries to add them up. */
  if (who === "daughter") return ZERO;
  const m = d[slot];
  if (typeof m === "string"){
    const f = FIXED[m]; return (f && f[who]) ? f[who] : ZERO;
  }
  if (!m) return ZERO;

  if (m.kind === "fixed"){
    const id = followRoast((who === "cheryl" && m.cheryl) ? m.cheryl : m.id);
    const f = FIXED[id]; if (!f) return ZERO;
    let v = f[who] || ZERO;
    if (slot === "lunch" && who === "cheryl" && !isFreeMeal(m)) v = add(v, CHERYL_LUNCH_ADDON);
    return v;
  }
  if (m.kind === "recipe"){
    const r = recipe(m.id); if (!r) return ZERO;
    /* Coach ruling 3.4, 19 September: no calorie or protein figure is computed or shown for
       her, on a plate or a day. She is portioned by composition, the same food in her own
       share. Her plates carry weights only. */
    if (who === "daughter") return ZERO;
    let v = r.plates[who] || ZERO;
    if (slot === "lunch" && who === "cheryl" && !isFreeMeal(m)) v = add(v, CHERYL_LUNCH_ADDON);
    return v;
  }
  if (m.kind === "leftover"){
    const src = day(m.from);
    if (!src || !src.dinner || src.dinner.kind !== "recipe") return ZERO;
    const r = recipe(src.dinner.id); if (!r) return ZERO;
    if (who === "daughter") return ZERO;
    let v = leftoverPlate(r, who);
    if (who === "cheryl") v = add(v, CHERYL_LUNCH_ADDON);
    return v;
  }
  return ZERO;
}

/* A leftover lunch is a weighed portion of the same dish, not the dinner plate.
   recipes.json carries the weight and the macros for each person; see leftoverMethod. */
const leftoverPortion = (r, who) => ((r.leftover||{}).portions||{})[who] || null;
function leftoverPlate(r, who){
  const x = leftoverPortion(r, who);
  if (!x || x.source === "not-scalable") return r.plates[who] || ZERO;
  return x.overBand || x;   /* count what the card tells him to take */
}

/* The day it lands on is not scored, but the WEEK has to count it or the whole plan
   flatters itself. 1,200 is an assumption, stated, not a measurement. */
function assumedFree(d, who){
  let k = 0;
  ["breakfast","lunch","afternoon","dinner"].forEach(sl => {
    const m = d[sl];
    const id = (typeof m === "string") ? m : (m && m.kind === "fixed" ? m.id : null);
    const f = id && FIXED[id];
    if (f && f.assumedKcal && d.diners.includes(who))
      k += (who === "cheryl" ? (f.assumedCheryl || f.assumedKcal * 0.75) : f.assumedKcal);
  });
  return k;
}

/* The weekly target is BUILT from the days actually counted, never hard-coded. A fixed
   13,800 is only right for a seven-day week with one cheat meal - Cheryl eats six days
   this week and a constant read her as 1,300 short of a target she was never on. This is
   the same mistake as the +611: comparing against a week nobody was planning. */
function weekTarget(who){
  const t = TARGETS[who];
  let days = 0, cheat = 0;
  WEEK.days.forEach(d => {
    if (d.free || !d.diners.includes(who)) return;
    days++; if (assumedFree(d, who) > 0) cheat++;
  });
  return {kcal: (days - cheat) * t.kcal + cheat * t.cheatKcal, days, cheat};
}

function weekTotal(who){
  let kcal = 0, assumed = 0, days = 0;
  WEEK.days.forEach(d => {
    if (d.free || !d.diners.includes(who)) return;
    kcal += dayTotal(d, who).kcal; assumed += assumedFree(d, who); days++;
  });
  return {kcal, assumed, days, total: kcal + assumed};
}

const dayTotal = (d, who) => d.free ? ZERO :
  ["breakfast","lunch","afternoon","dinner"].reduce((a,s) => add(a, mealFor(d,s,who)), ZERO);

/* Something else = no numbers, so the day is reported but not judged. */
const isFreeMeal = m => {
  if (typeof m === "string") return !!(FIXED[m] || {}).free;
  if (m && m.kind === "fixed") return !!(FIXED[m.id] || {}).free;
  if (m && m.kind === "recipe") return /^own-/.test(m.id);
  return false;
};
const freeSlots = d => ["breakfast","lunch","afternoon","dinner"].filter(sl => isFreeMeal(d[sl]));

/* Cheryl's 2:30 feed is carried on her lunch because she teaches - but it is still a meal,
   and if the lunch is "something else" the feed goes with it. Without this, setting every
   slot on a day to nothing still reported her at 133 kcal. */
const cherylAddonOn = d => !!(d && d.lunch && !isFreeMeal(d.lunch));

function status(d, who){
  const t = TARGETS[who], v = dayTotal(d, who), problems = [];
  const partial = freeSlots(d).length > 0;
  /* Calories and protein are targets and a missing meal makes them meaningless.
     Salt is a ceiling: an untracked meal can only add to it, so a breach on a
     partial day is real and gets flagged. Suppressing it hid every Saturday. */
  if (!partial){
    const dk = Math.round(v.kcal - t.kcal);
    if (Math.abs(dk) > t.band) problems.push({k:"kcal", d:dk});
    if (v.protein < t.protein) problems.push({k:"protein", d:Math.round((v.protein - t.protein)*10)/10});
  }
  if (v.salt > t.salt) problems.push({k:"salt", d:Math.round((v.salt - t.salt)*10)/10});
  return {v, problems};
}

/* Coach ruling 3.5: fibre is REPORTED, never gating. It can never fail a plan or trigger
   a substitution - where it competes with calories and protein inside 1,900, fibre loses.
   The only thing worth saying is a pattern, so this looks for three consecutive counted
   days under 25g and says nothing at all otherwise. */
function fibreRun(who){
  const t = TARGETS[who]; let best = null, run = [];
  WEEK.days.forEach(d => {
    const counted = !d.free && d.diners.includes(who) && freeSlots(d).length === 0;
    if (!counted){ run = []; return; }
    if (dayTotal(d, who).fibre < t.fibre) run.push(d.title);
    else run = [];
    if (run.length >= 3 && (!best || run.length > best.length)) best = run.slice();
  });
  return best;
}

function fixLine(who, problems){
  if (!problems.length) return "";
  const bits = problems.map(p =>
    p.k === "kcal"    ? (p.d>0?"+":"") + p.d + " kcal" :
    p.k === "protein" ? p.d + "g protein" : "+" + p.d + "g salt");
  const kcal = problems.find(p => p.k === "kcal");
  const prot = problems.find(p => p.k === "protein");
  let sug = "";
  /* Coach ruling, 19 September: 170g is a FLOOR, not a target. 167.7g is a fail and so is
     169.3g. This used to say a shortfall under 15g could be left alone, which was true of a
     target and is not true of a floor. Protein is protected ahead of calories: a day light on
     calories that hits protein is fine and the reverse is not. */
  if (prot && prot.d <= -15) sug = " That is a fail — 170g is a floor. Closest fix is plain Skyr: 100g is 63 kcal and 11g.";
  else if (prot)             sug = " <b>170g is a floor, so this is a fail even though it is close.</b> " +
                                   Math.ceil(Math.abs(prot.d) / 11 * 100) + "g of plain Skyr covers it for " +
                                   Math.ceil(Math.abs(prot.d) / 11 * 63) + " kcal.";
  else if (kcal && kcal.d < 0) sug = " A bigger afternoon feed is the easiest 100–200.";
  else if (kcal && kcal.d > 0) sug = " An apple at 2:30 instead, or a smaller plate.";
  return (who === "jon" ? "Jon" : "Cheryl") + ": " + bits.join(" · ") + "." + sug;
}

/* ---------- rendering ---------- */
const n1 = x => Math.round(x*10)/10;

function renderTabs(){
  const nav = $("#tabs"); nav.innerHTML = "";
  WEEK.days.forEach((d,i) => {
    const b = document.createElement("button");
    b.innerHTML = d.label + '<span class="dot"></span>';
    if (i === current) b.classList.add("on");
    if (!d.free && (status(d,"jon").problems.length || status(d,"cheryl").problems.length))
      b.classList.add("amber");
    b.onclick = () => { current = i; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
}

function renderTotals(d){
  const el = $("#totals");
  const eating = ["jon","cheryl"].filter(w => d.diners.includes(w));
  const wrap = (sum, body) =>
    '<summary><span class="tsum"><span class="who">' + d.title + '</span>' +
    '<span>' + sum + '</span></span></summary>' +
    (body ? '<div class="tbody">' + body + '</div>' : '');

  if (d.free){
    el.innerHTML = wrap('<span class="ok">Not counted</span>', "");
    el.open = false;
    document.body.classList.remove("totals-open");
    return;
  }

  let sum = "", body = "", flag = false;

  eating.forEach(who => {
    const {v, problems} = status(d, who);
    if (problems.length) flag = true;
    const name = who === "jon" ? "Jon" : "Cheryl";
    sum += (sum ? ' <span class="sep">\u00b7</span> ' : "") +
      '<span class="' + (problems.length ? "amber" : "ok") + '">' + name +
      ' <b>' + Math.round(v.kcal).toLocaleString() + '</b></span>';
    body += '<div class="trow"><span class="who">' + name + '</span>' +
      '<span class="' + (problems.length ? "amber" : "ok") + '"><b>' +
      Math.round(v.kcal).toLocaleString() + '</b> kcal \u00b7 <b>' + n1(v.protein) + 'g</b> protein \u00b7 ' + n1(v.fibre) +
      'g fibre \u00b7 ' + n1(v.salt) + 'g salt</span></div>';
  });
  eating.forEach(who => {
    const line = fixLine(who, status(d, who).problems);
    if (line) body += '<p class="fix">' + line + '</p>';
  });

  /* the week, which is the number that actually decides whether this works */
  body += '<div class="wk">';
  eating.forEach(who => {
    const w = weekTotal(who), t = TARGETS[who], tg = weekTarget(who);
    const gap = w.total - tg.kcal, off = Math.abs(gap) > t.weekBand;
    if (off) flag = true;
    body += '<div class="trow"><span class="who">' + (who === "jon" ? "Jon" : "Cheryl") +
      ", the week</span><span class=\"" + (off ? "amber" : "ok") + '"><b>' +
      w.total.toLocaleString() + '</b> kcal \u00b7 ' + (gap > 0 ? "+" : "") + gap.toLocaleString() +
      ' vs ' + tg.kcal.toLocaleString() + '</span></div>';
  });
  const anyAssumed = eating.some(who => weekTotal(who).assumed > 0);
  if (anyAssumed)
  {
    const tg = weekTarget("jon");
    body += '<p class="fix"><b>The week is the target, not the day.</b> ' + (tg.days - tg.cheat) +
         ' counted days at ' + TARGETS.jon.kcal.toLocaleString() + ' plus ' + (tg.cheat === 1 ? 'a day' :
         tg.cheat + ' days') + ' of about ' + TARGETS.jon.cheatKcal.toLocaleString() +
         ' that nobody measures \u2014 <b>' + tg.kcal.toLocaleString() + ' for Jon\'s week</b>. ' +
         'The cheat meal is inside that figure at an assumed 1,200 kcal (900 for Cheryl); it was ' +
         'always budgeted, and it is not something to pay back on Monday. ' +
         '<b>Each person\'s target is built from the days they actually eat</b>, so it is not the ' +
         'same number for both of them.</p>';
  }
  eating.forEach(who => {
    const run = fibreRun(who);
    if (run) body += '<p class="fix"><b>' + (who === "jon" ? "Jon" : "Cheryl") + ': fibre under ' +
      TARGETS[who].fibre + 'g on ' + run.length + ' days running</b> \u2014 ' + run.join(", ") +
      '. Reported, not a failure: fibre never outranks calories or protein. Worth a look only ' +
      'because it is a run rather than a day.</p>';
  });
  body += '</div>';

  const free = freeSlots(d);
  if (free.length)
    body += '<p class="fix">' + free.map(f => f === "afternoon" ? "2:30" : f).join(" and ") +
         ' is your own, so calories and protein are not scored. <b>Salt still is</b> \u2014 an ' +
         'untracked meal can only add to it.</p>';

  if (flag) sum += '<span class="flag"></span>';
  el.innerHTML = wrap(sum, body);
  el.open = TOTALS_OPEN;
  document.body.classList.toggle("totals-open", TOTALS_OPEN);
}

/* Collapsed by default and remembered, because it is pinned to the top of every day. */
let TOTALS_OPEN = localStorage.getItem("totals-open") === "1";

/* Any combination should land near 1,900, so each slot has a target and every card
   says where it sits against it. Set in recipes.json as slotTargets. */
function slotGap(slot, kcal){
  const t = (DATA.slotTargets || {})[slot];
  if (!t || !kcal) return "";
  const g = Math.round(kcal - t);
  if (Math.abs(g) <= 40) return '<p class="note">On target for a ' +
    (slot === "afternoon" ? "2:30 feed" : slot) + ' \u2014 ' + t + ' kcal.</p>';
  return '<p class="note' + (g > 0 ? ' warn' : '') + '"><b>' + (g > 0 ? "+" : "") + g +
    ' kcal against a ' + t + '</b> for this slot. Four slots at target make 1,900; this one ' +
    (g > 0 ? 'has to come back off another meal.' : 'leaves room on another meal.') + '</p>';
}

/* slow cooks read as hours: "8 hr", not "480 min" */
const mins = m => m >= 120 ? (Math.round(m / 30) / 2) + " hr" : m + " min";
const macroRow = (p, r) =>
  '<div class="macros"><div><b>' + Math.round(p.kcal) + '</b> <span>kcal</span></div>' +
  '<div><b>' + p.protein + 'g</b> <span>protein</span></div>' +
  '<div><b>' + p.fibre + 'g</b> <span>fibre</span></div>' +
  '<div><b>' + p.salt + 'g</b> <span>salt</span></div>' +
  (r && typeof r.timeMinutes === "number"
     ? '<div>' + (r.timeMinutes === 0
         ? '<b>No cooking</b>'
         : '<b>' + mins(r.timeMinutes) + '</b> <span>' +
           (r.handsOnMinutes ? r.handsOnMinutes + ' hands-on' : 'to cook') + '</span>') + '</div>'
     : '') + '</div>';

const fixedOptionsFor = (slot, sel) => (SLOT_OPTIONS[slot] || [])
  .map(id => {
    const f = FIXED[id]; if (!f) return "";
    return '<option value="' + id + '"' + (id === sel ? " selected" : "") + '>' + f.name +
      (f.jon.kcal ? ' \u2014 ' + f.jon.kcal + ' kcal, ' + f.jon.protein + 'g' : '') + '</option>';
  }).join("");

const fixedTail = (slot, sel) => (FIXED_FOR_SLOT[slot] || []).map(id => {
  const f = FIXED[id]; if (!f) return "";
  return '<option value="' + id + '"' + (id === sel ? " selected" : "") + '>' + f.name +
    (f.jon.kcal ? ' \u2014 ' + f.jon.kcal + ' kcal, ' + f.jon.protein + 'g' : '') + '</option>';
}).join("");

/* A leftover lunch was the one card in the week with no picker at all - the only meal
   you could not say "we'll do our own thing" about. It gets the full lunch list, and this
   option to come back, which is why the replacement remembers where it came from. */
function leftoverOption(from, selected){
  const src = day(from); if (!src) return "";
  const dn = src.dinner;
  const r  = (dn && dn.kind === "recipe") ? recipe(dn.id) : null;
  return '<option value="__leftover"' + (selected ? " selected" : "") + '>Leftovers \u2014 ' +
    src.title + "'s " + (r ? r.name.toLowerCase() : "dinner") + '</option>';
}

const optionsFor = (slot, sel) => DATA.recipes.filter(r => r.slot === slot && (!r.retired || r.id === sel))
  .sort((a,b) => a.name.localeCompare(b.name))
  .map(r => '<option value="' + r.id + '"' + (r.id===sel?" selected":"") + '>' +
    r.name + ' — ' + Math.round(r.plates.jon.kcal) + ' kcal, ' + r.plates.jon.protein + 'g' +
    (typeof r.timeMinutes === "number" ? ', ' + (r.timeMinutes === 0 ? "no cooking" : mins(r.timeMinutes)) : '') +
    '</option>')
  .join("");

/* No cooking at lunchtime. A lunch that needs a hob says when it gets one. */
const PREP_LABEL = {"weekend":"Weekend batch", "night-before":"Made the night before",
                    "same-day":"Nothing to cook"};
function prepBlock(r){
  const pr = r && r.prep; if (!pr) return "";
  let h = '<p class="note' + (pr.when === "same-day" ? '' : ' prep') + '"><b>' +
          (PREP_LABEL[pr.when] || pr.when) + '.</b> ' + pr.note + '</p>';
  if (pr.pan) h += '<p class="note"><b>There is a pan in this one.</b> ' + pr.pan + '</p>';
  return h;
}

/* Chef's rule, 19 September: every dish wants one crisp element. Nineteen of thirty-six had
   none, and the dishes the family already likes are, without exception, the ones that do. */
const CRISP = /crispbread|crouton|pangrattato|breadcrumb|walnut|almond|peanut|pumpkin seed|sesame|dukkah|shallot|seeds|nuts|crackling|cornichon|crisp|toasted|pitta|crispy|charred|apple/i;
function crispNote(r){
  if (!r || r.retired || !(r.ingredients||[]).length) return "";
  const has = r.ingredients.some(i => CRISP.test(i.item)) || CRISP.test(r.name) ||
              (r.method||[]).some(m => /crisp|toasted|crunch|charred|crouton|pangrattato/i.test(m));
  return has ? "" :
    '<p class="note"><b>Nothing crisp in this one.</b> 8\u201315g of toasted seed, nut or ' +
    'breadcrumb over the top is 50\u2013100 kcal and it is the difference between a plate you ' +
    'eat and one you finish.</p>';
}

/* Nothing about who eats what should have to be inferred from an absence. */
function slotNote(d, slot){
  if (!d.diners.includes("cheryl")) return "";
  if (slot === "afternoon")
    return '<p class="note"><b>Jon only.</b> Cheryl is teaching at 2:30, so her Skyr and ' +
           'banana go with her lunch instead. Nothing here for her.</p>';
  if (slot === "lunch"){
    if (!cherylAddonOn(d))
      return '<p class="note">Lunch is your own, so <b>Cheryl\'s 2:30 feed goes with it</b> — ' +
             'nothing is counted for her here, and nothing for it reaches the shopping list.</p>';
    return '<p class="note"><b>Cheryl has ' + CHERYL_LUNCH_ADDON.label + ' with this</b>, ' +
           'on top of whatever the lunch is — her 2:30 feed, moved because she is teaching. ' +
           'Already counted in her figures and already on the shopping list.</p>';
  }
  return "";
}
const closeCard = (h, d, slot) => h + slotNote(d, slot) + '</div></details>';
/* Collapsed by default: slot, name and the macro row are all you need when you are
   looking at the week. One tap gets the rest. */
const OPEN = new Set();          /* which cards the user has opened, kept across re-renders */
const cardHead = (d, slot, label, name, macros, cls) =>
  '<details class="meal' + (cls || '') + '" data-card="' + d.id + '/' + slot + '"' +
  (OPEN.has(d.id + '/' + slot) ? ' open' : '') + '><summary>' +
  '<div class="slot">' + label + '</div><h2>' + name + '</h2>' + (macros || '') +
  '</summary><div class="mbody">';

/* Jon is 1 share, Cheryl 0.75. The daughter is not modelled on the fixed items. */
const sharesFor = (d, slot) =>
  1 + (d.diners.includes("cheryl") && slot !== "afternoon" ? 0.75 : 0);

/* "Portions 3 \u00b7 recipe makes 5" read as though the recipe would make 5 whatever was
   set. The family set 3 for three dinners and could not tell what they were cooking. It is
   said plainly now - and because a portion is a share of the recipe, not a plate (plates run
   4:3 and the daughter's is her own size), it checks the batch really covers tonight's
   plates. At 3 the haddock came to 546g for three plates that take 593g. */
/* How many portions tonight's plates really take. A portion is a share of the recipe,
   not a plate - plates run 4:3 and the daughter's is her own size - so counting heads
   said "1 spare" where the batch only just covered three plates. */
function platesInPortions(r, m, d){
  const comps = (r.plateSplit || {}).components || [];
  const batch = {}; r.ingredients.forEach(i => batch[i.item] = i.grams);
  const who = ["jon","cheryl"].filter(w => d.diners.includes(w));
  if (d.diners.includes("daughter") && m.daughter) who.push("daughter");
  let need = 0;
  comps.forEach(c => {
    const g = who.reduce((a, w) => a + (c[w] || 0), 0), full = batch[c.item];
    if (g && full) need = Math.max(need, g * r.basePortions / full);
  });
  return need || who.length;
}

function scaleNote(r, m, d){
  let h = '<p class="note">' + (m.portions === r.basePortions
    ? 'Quantities as written \u2014 the recipe is for ' + r.basePortions + '.'
    : 'The recipe is written for ' + r.basePortions + '. <b>Every quantity on this card has ' +
      'been scaled to ' + m.portions + '</b> \u2014 cook what the card shows.') + '</p>';
  const comps = (r.plateSplit || {}).components || [];
  const batch = {}; r.ingredients.forEach(i => batch[i.item] = i.grams);
  const who = ["jon","cheryl"].filter(w => d.diners.includes(w));
  if (d.diners.includes("daughter") && m.daughter) who.push("daughter");
  let worst = null, min = 0;
  comps.forEach(c => {
    const need = who.reduce((a, w) => a + (c[w] || 0), 0), full = batch[c.item];
    if (!need || !full) return;
    const have = full * m.portions / r.basePortions;
    min = Math.max(min, Math.ceil(need * r.basePortions / full - 1e-9));
    if (have < need * 0.97 && (!worst || have / need < worst.have / worst.need))
      worst = {item: c.item.split(",")[0].toLowerCase(), have, need};
  });
  if (worst)
    h += '<p class="note warn"><b>At ' + m.portions + ' there isn\'t quite enough for tonight\'s ' +
         who.length + ' plates</b> \u2014 it makes ' + Math.round(worst.have) + 'g of ' + worst.item +
         ' and the plates take ' + Math.round(worst.need) + 'g. <b>Set it to ' + min + '.</b> ' +
         'The number is shares of the recipe, not plates, and the plates are different sizes.</p>';
  return h;
}

function mealCard(d, slot){
  const m = d[slot];
  const solo = slot === "afternoon" && d.diners.includes("cheryl");
  const label = (slot === "afternoon" ? "2:30" : slot[0].toUpperCase() + slot.slice(1)) +
                (solo ? ' \u2014 Jon only' : '');
  const cls = solo ? ' solo' : '';
  let h;

  if (typeof m === "string"){
    const f = FIXED[m];
    h = cardHead(d, slot, label, f.name, macroRow(f.jon, f), cls);
    if ((SLOT_OPTIONS[slot] || []).length)
      h += '<select class="fswap" data-slot="' + slot + '">' + fixedOptionsFor(slot, m) + '</select>';
    if (!f.free) h += slotGap(slot, f.jon.kcal);
    return closeCard(h + fixedRecipe(f, sharesFor(d, slot)), d, slot);
  }
  if (m.kind === "fixed"){
    const rid = followRoast(m.id), f = FIXED[rid];
    const nm = (rid !== m.id)
      ? "Monday, off Sunday's joint \u2014 " + f.name.split("\u2014 ")[1] : f.name;
    h = cardHead(d, slot, label, nm, macroRow(f.jon, f), cls);
    if (FIXED_FOR_SLOT[slot])
      h += '<select class="swap" data-slot="' + slot + '"' +
           (m.wasFrom ? ' data-from="' + m.wasFrom + '"' : '') + '>' +
           (m.wasFrom ? leftoverOption(m.wasFrom, false) : '') +
           optionsFor(slot, m.id) + fixedTail(slot, m.id) + '</select>';
    if (!f.free) h += slotGap(slot, f.jon.kcal);
    h += fixedRecipe(FIXED[m.id], sharesFor(d, slot));
    if (rid !== m.id)
      h += '<p class="note prep"><b>Following Sunday.</b> Change the joint there and this changes ' +
           'with it \u2014 it is the same meat, reheated in the gravy.</p>';
    /* the one joint Monday cannot inherit: the ham's leftovers are frozen, not eaten */
    if (m.id === "sunday-roast" && (FIXED[roastOn("sun")] || {}).noLeftoverLunch)
      h += '<p class="note warn"><b>Sunday is the ham, so there are no leftovers for tonight.</b> ' +
           'They go in the freezer the same night \u2014 a 4.66g plate is not one to eat twice in ' +
           'two days. <b>Pick Monday\'s dinner yourself</b>; the figures above are the generic roast ' +
           'and are not what you are eating.</p>';
    if (m.cheryl) h += '<p class="note">Cheryl has the ' +
                       FIXED[m.cheryl].name.replace(/^the /i, "").toLowerCase() + '.</p>';
    if (f.bought) h += '<p class="note">Not cooked here — nothing for the shopping list.</p>';
    return closeCard(h, d, slot);
  }
  if (m.kind === "leftover"){
    const src = day(m.from);
    const r = (src && src.dinner.kind === "recipe") ? recipe(src.dinner.id) : null;
    h = cardHead(d, slot, label, r ? src.title + "'s " + r.name.toLowerCase() : "Leftovers",
                 r ? macroRow(leftoverPlate(r, "jon"), {timeMinutes: 0}) : "", cls);
    h += '<select class="swap" data-slot="' + slot + '" data-from="' + m.from + '">' +
         leftoverOption(m.from, true) + optionsFor(slot, null) + fixedTail(slot, null) +
         '</select>';
    if (r){

      const lo = r.leftover || {};
      const pj = leftoverPortion(r, "jon"), pc = leftoverPortion(r, "cheryl");
      h += '<h3 class="rh">How much to weigh out</h3>';
      const weigh = (x, lab) => {
        if (!x) return '<li><b>' + lab + ':</b> no weight recorded — if this recipe should ' +
                       'have one, your copy of the data is stale. Reload the page.</li>';
        if (x.source === "not-scalable")
          return '<li><b>' + lab + ':</b> can\'t be weighed off this recipe — ' + x.why + '</li>';
        return '<li><b>' + lab + ' — ' + x.grams + 'g</b> · ' + x.kcal + ' kcal · ' +
               x.protein + 'g protein' + (x.source === "derived" ? ' <i>· derived</i>' : '') + '</li>';
      };
      h += '<ul class="ing">' + weigh(pj, "Jon") + weigh(pc, "Cheryl") + '</ul>';
      h += '<p class="note"><b>Cooked weights</b> \u2014 this is the finished dish, so it goes ' +
           'straight from the fridge onto the scales. No conversion.</p>';
      if (pj && pj.salt >= 2)
        h += '<p class="note warn"><b>' + pj.salt + 'g of salt in this tub</b>, against 6g for ' +
             'the day. Put it with a low-salt dinner.</p>';
      if (pj && pj.overBand)
        h += '<p class="note warn">That costed portion is <b>' + pj.kcal + ' kcal</b>, over the ' +
             '550 top of the lunch slot. <b>Take ' + pj.overBand.grams + 'g</b> instead — ' +
             pj.overBand.kcal + ' kcal, ' + pj.overBand.protein + 'g protein.</p>';
      h += '<p class="note prep"><b>Leftovers \u2014 reheat and nothing else.</b> ' +
           'The cooking was done on ' + (src ? src.label : 'the night it was made') + '.</p>';
      if (lo.note) h += '<p class="note">' + lo.note + '</p>';

      const eaten = src.diners.filter(p => p !== "daughter" || src.dinner.daughter).length;
      const left  = src.dinner.portions - eaten;
      const need  = d.diners.filter(p => p !== "daughter").length;
      h += '<p class="note' + (left < need ? " warn" : "") + '">' +
        r.name + ' makes ' + src.dinner.portions + ' · ' + eaten + ' eaten on ' + src.label +
        ' · <b>' + left + ' left</b>, and this needs ' + need + '.' +
        (left < need ? ' <b>Not enough — raise ' + src.label + "'s portions.</b>" : '') + '</p>';
    }
    h += '<p class="note">Follows whatever ' + (src ? src.label : "that day") + "'s dinner ends up being.</p>";
    return closeCard(h, d, slot);
  }

  const r = recipe(m.id);
  h = cardHead(d, slot, label, r ? r.name : "\u2014", r ? macroRow(r.plates.jon, r) : "", cls);
  h += '<select class="swap" data-slot="' + slot + '"' +
       (m.wasFrom ? ' data-from="' + m.wasFrom + '"' : '') + '>' +
       (m.wasFrom ? leftoverOption(m.wasFrom, false) : '') +
       optionsFor(slot, m.id) + fixedTail(slot, m.id) + '</select>';
  h += '<div class="ctrl"><label>Portions</label><div class="step">' +
       '<button class="dec" data-slot="' + slot + '">−</button><span>' + m.portions + '</span>' +
       '<button class="inc" data-slot="' + slot + '">+</button></div>' +
       '</div>';
  if (r) h += scaleNote(r, m, d);

  /* Swapping a leftover lunch away leaves the dinner still cooking for it, and nothing
     else in the week points back, so the spare portions would go unremarked. */
  if (slot === "dinner" && r){
    const eaten = d.diners.filter(p => p !== "daughter" || m.daughter).length;
    const spare = Math.floor(m.portions - platesInPortions(r, m, d) + 0.03);
    const claimed = WEEK.days.some(x => x.lunch && x.lunch.kind === "leftover" && x.lunch.from === d.id);
    if (spare > 0 && !claimed)
      h += '<p class="note warn"><b>' + spare + ' portion' + (spare > 1 ? 's' : '') +
           ' spare</b> \u2014 this makes ' + m.portions + ', ' + eaten + ' eaten tonight, and no ' +
           'lunch this week is taking the rest. Drop the portions or the shopping list buys for them.</p>';
  }

  if (d.diners.includes("daughter") && r && r.plates.daughter){
    h += '<div class="dau"><input type="checkbox" id="dau-' + slot + '"' +
         (m.daughter ? " checked" : "") + '><label for="dau-' + slot + '">Daughter eating this</label></div>';
    if (!m.daughter)
      h += '<div class="dau"><input type="text" class="alt" data-slot="' + slot + '" ' +
           'placeholder="Something else for her — goes on the list" value="' +
           String(m.alt||"").replace(/"/g,"&quot;") + '"></div>';
  }
  if (r && r.plates.jon && r.plates.jon.assumed)
    h += '<p class="note warn">Jon\'s plate here is <b>derived, not tested</b> — treat the numbers as an estimate.</p>';
  if (d.diners.includes("daughter") && r && r.plates.daughter && r.plates.daughter.derivedShare)
    h += '<p class="note">Her share here is <b>derived from the ratio, not built for this meal</b> — ' +
         'it is the same food in her own portion, so treat the weight as a starting point and ' +
         'go by what she actually eats.</p>';
  if (d.diners.includes("daughter") && r && !r.plates.daughter)
    h += '<p class="note">Not a family meal — nothing here for your daughter.</p>';
  if (r && r.retired)
    h += '<p class="note warn"><b>Retired.</b> ' + (r.retiredWhy || '') +
         ' It is still here because it is in this plan \u2014 swap it and it leaves the list.</p>';
  if (r && (r.warnings||[]).length)
    h += r.warnings.map(w => '<p class="note warn">' + w + '</p>').join("");
  if (r && r.secondPanForDaughter)
    h += '<p class="note warn"><b>Needs a second pan for her.</b> The brief says that has to be earned.</p>';
  if (r && r.plates.jon.plateGrams > 750)
    h += '<p class="note warn"><b>' + r.plates.jon.plateGrams + 'g on the plate</b>, against a tested ceiling of 750.</p>';
  if (r && r.plates.jon.salt >= 3)
    h += '<p class="note warn"><b>' + r.plates.jon.salt + 'g of salt in one plate</b>, against 6g for the day.</p>';
  if (r){
    const hasMethod = (r.method||[]).length > 0;
    h += '<div class="more"><div class="mhead">' +
         (hasMethod ? 'Recipe, ingredients and plates' : 'Ingredients and plates') +
         '</div><div class="body">';
    if (r.plateSpec){
      h += '<h3 class="rh">The plates</h3><ul class="ing">';
      [["jon","Yours"],["cheryl","Cheryl"],["daughter","Your daughter"]].forEach(([k,lab]) => {
        if (r.plateSpec[k]) h += '<li><b>' + lab + ':</b> ' + r.plateSpec[k] + '</li>';
      });
      h += '</ul>';
      if (r.plateSpec.note) h += '<p class="note">' + r.plateSpec.note + '</p>';
    }
    h += slotGap(slot, r.plates.jon.kcal);
    if (slot === "lunch") h += prepBlock(r);
    h += crispNote(r);
    h += splitBlock(r, d.diners.includes("daughter") && m.daughter);

    /* the list has to be what THIS cook needs, not what the recipe's base batch needs */
    const sc = m.portions / r.basePortions;
    const amt = g => { const v = g * sc; return v >= 10 ? Math.round(v) : Math.round(v*10)/10; };
    h += '<h3 class="rh">Ingredients</h3>' +
      '<ul class="ing"><li>' +
      r.ingredients.map(i => i.item + ' — ' + amt(i.grams) + (i.packUnit === "ml" ? "ml" : "g") +
        state(i) + (i.note ? ', ' + i.note : '') +
        (i.assumed ? ' <i>· quantity estimated</i>' : '')).join('</li><li>') + '</li></ul>';
    if ((r.method||[]).length){
      /* {{n}} marks a quantity that belongs to this batch. Day totals, per-100g rates and
         per-portion figures are left as bare numbers and never scale. */
      const meth = r.method.map(t =>
        t.replace(/\{\{([\d.]+)\}\}/g, (_, v) => amt(parseFloat(v))));
      h += '<h3 class="rh">Method</h3><ol class="ing"><li>' + meth.join('</li><li>') + '</li></ol>';
    }
    (r.tips||[]).forEach(t => {
      const cls = t.tone === "hot" ? " warn" : "";
      h += '<p class="note' + cls + '">' + t.text + '</p>';
    });
    h += '</div></div>';
  }

  return closeCard(h, d, slot);
}

/* One recipe, one ratio. Jon is one share, Cheryl three-quarters of one. If they are
   both having it, the mix is made once at 1.75 shares and poured 4:3. */
function fixedRecipe(f, shares){
  const r = f.recipe; if (!r) return "";
  let h = "";
  if (f.mix){
    const n = shares || 1, c = n - 1;
    const q = (v, unit) => (v >= 10 ? Math.round(v) : Math.round(v*10)/10) + (unit || 'g');
    /* a count that scales with the weight, so three rashers does not stay three rashers
       when the pan is feeding two people */
    const qc = (v, unit, cnt) => {
      let out = q(v, unit);
      if (!cnt) return out;
      const raw = v / cnt.each, r = Math.round(raw * 2) / 2;
      if (r <= 0) return out;
      const exact = Math.abs(raw - Math.round(raw)) < 0.06;
      const num = exact ? String(Math.round(raw))
                        : (Math.abs(r - Math.round(r)) < 0.01 ? String(Math.round(r)) : String(r));
      return out + ' <span class="cnt">' + (exact ? '' : 'about ') + num + ' ' +
             ((exact ? Math.round(raw) : r) === 1 ? cnt.one : cnt.many) + '</span>';
    };
    if (c > 0){
      /* The combined figure on its own read as one person's portion - Jon weighed out 350g
         of cottage cheese for himself when 200g was his and 150g was Cheryl's. The recipes
         have carried a per-person column since the 4:3 rule went in; these never did. */
      h += '<h3 class="rh">How much each</h3>' +
           '<div class="ratio"><b>4 : 3</b><span>jon &middot; cheryl</span></div>' +
           '<div class="splitwrap"><table class="split"><thead><tr><th></th><th>Jon</th>' +
           '<th>Cheryl</th><th>In the pan</th></tr></thead><tbody>' +
        f.mix.map(([item, g, unit, cnt]) =>
          '<tr><td>' + item + '</td><td><b>' + qc(g, unit, cnt) + '</b></td><td>' +
          qc(g * c, unit, cnt) + '</td><td>' + qc(g * n, unit, cnt) + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<p class="note"><b>Jon\'s column is one portion \u2014 that is the recipe.</b> The last ' +
        'column is the two of them together, which is what goes in the pan and what the shopping ' +
        'list buys. <b>Don\'t weigh the last column onto one plate.</b></p>' +
        '<p class="note">Where something comes in units, <b>the weight is the real instruction</b> ' +
        'and the count beside it is a guide \u2014 three-quarters of a rasher is a real number and ' +
        'not a real rasher. Round in Jon\'s favour on his plate and keep the pan honest.</p>';
    } else
      h += '<h3 class="rh">Ingredients</h3><ul class="ing"><li>' +
        f.mix.map(([item, g, unit, cnt]) => item + ' \u2014 ' + qc(g, unit, cnt)).join('</li><li>') +
        '</li></ul>';
  } else if (r.ing && r.ing.length)
    h += '<h3 class="rh">Ingredients</h3><ul class="ing"><li>' + r.ing.join('</li><li>') + '</li></ul>';
  if (r.method && r.method.length)
    h += '<h3 class="rh">Method</h3><ol class="ing"><li>' + r.method.join('</li><li>') + '</li></ol>';
  if (r.note)   h += '<p class="note">' + r.note + '</p>';
  if (r.cheryl) h += '<p class="note"><b>Cheryl:</b> ' + r.cheryl + '</p>';
  return h;
}

/* Who gets how much. One-pot dishes are served by weight out of the pan; assembled
   ones are split component by component. Derived rows are marked - see plateSplit. */
/* The rule, not a best fit: Jon is 4, Cheryl is 3 — she has three-quarters of whatever he
   has, always. Only the daughter's share moves, and it rounds against Jon's 4. Keeping the
   first two numbers fixed is the whole point: there is one ratio to remember, not thirty-four. */
function ratioOf(vals){
  if (!vals.length) return null;
  const rr = [4];
  if (vals.length > 1) rr.push(3);                                  /* Cheryl, by the rule */
  for (let i = 2; i < vals.length; i++)                             /* the daughter */
    rr.push(Math.max(1, Math.round(vals[i] / vals[0] * 4)));
  return {rr, n: rr.reduce((x,y) => x+y, 0)};
}

function splitBlock(r, eats){
  const s = r.plateSplit; if (!s) return "";
  const who = [["jon","Jon"],["cheryl","Cheryl"],["daughter","Daughter"]]
    .filter(([k]) => s.grams[k] !== undefined && (k !== "daughter" || eats));
  if (!who.length) return "";
  let h = '<h3 class="rh">How much each</h3>';
  const rat = ratioOf(who.map(([k]) => s.grams[k]));
  if (rat)
    h += '<div class="ratio"><b>' + rat.rr.join(' : ') + '</b>' +
         '<span>' + who.map(([,lab]) => lab.toLowerCase()).join(' &middot; ') +
         '</span></div><p class="note">Eyeball it in those proportions \u2014 no scales, no sums. ' +
         'It runs Jon slightly generous, so <b>weigh his plate on a tight day</b> and share the ' +
         'rest out by eye. The weights below are the exact version.</p>';
  if (s.servedByWeight){
    h += '<ul class="ing"><li>' + who.map(([k,lab]) =>
      '<b>' + lab + ' \u2014 ' + s.grams[k] + 'g</b> onto the plate').join('</li><li>') + '</li></ul>';
    return h + '<p class="note">Served as one thing \u2014 weigh the plate rather than counting ' +
           'components. Where the recipe adds bread or a spoon of something alongside, that is ' +
           'inside these weights.</p>';
  }
  if (!(s.components || []).length) return "";   /* the plates block above already spells it out */
  h += '<div class="splitwrap"><table class="split"><thead><tr><th></th>' +
       who.map(([,lab]) => '<th>' + lab + '</th>').join('') + '</tr></thead><tbody>';
  const odd = [];
  s.components.forEach(c => {
    const tot = who.reduce((a,[k]) => a + (c[k]||0), 0) || 1;
    if (rat && who.some(([k],i) => Math.abs((c[k]||0)/tot - rat.rr[i]/rat.n) > 0.12))
      odd.push(c.item.split(",")[0].toLowerCase());
    h += '<tr><td>' + c.item.split(",")[0] +
         (c.note ? ' <span class="cnt">' + c.note + '</span>' : '') + '</td>' +
         who.map(([k]) => '<td>' + (c[k] ? '<b>' + c[k] + '</b>g' : '\u2014') + '</td>').join('') +
         '</tr>';
  });
  h += '<tr class="cooked"><td>On the plate, finished</td>' + who.map(([k]) =>
         '<td>' + s.grams[k] + 'g</td>').join('') + '</tr></tbody></table></div>';
  const src = s.source === "ratio"
    ? '. <b>One recipe, one ratio</b> \u2014 every ingredient splits the same way, so nothing is ' +
      'cooked twice and nobody gets a different version.'
    : '.';
  if (odd.length)
    h += '<p class="note warn"><b>The ratio does not fit the ' + odd.join(' or the ') +
         '</b> \u2014 use the row above for that one.</p>';
  h += '<p class="note"><b>The gram figures are the ingredient list\'s own</b> \u2014 raw, dry or ' +
       'drained, whichever that line says. If the dish gets cooked, weigh them before it does or ' +
       'use the ratio afterwards: proportions survive the pan, weights do not. Cold tubs need ' +
       'neither \u2014 what you weigh in is what you eat. The bottom row is the finished plate' +
       src + '</p>';
  return h;
}

/* standing rule 8: every weight is raw and dry unless it says otherwise */
function state(i){
  if (i.cooked) return ' <i>cooked</i>';
  if (i.aisle === "meat-fish") return ' <i>raw</i>';
  if (/pasta|rice|lentil|oats|bulgur|barley|couscous|quinoa|breadcrumb/i.test(i.item))
    return ' <i>dry</i>';
  return "";
}

function render(){
  /* remember what is open before the DOM is replaced */
  document.querySelectorAll("details.meal").forEach(el => {
    if (el.open) OPEN.add(el.dataset.card); else OPEN.delete(el.dataset.card);
  });
  const d = WEEK.days[current];
  renderTabs(); renderTotals(d);
  const el = $("#day");
  if (d.free){
    el.innerHTML = '<p class="free"><strong>Saturday isn\'t counted.</strong>' +
      'No target, no tracking, no photograph. Protein still holds as a habit.<br><br>' +
      'The risk is Sunday, not Saturday.</p>';
    return;
  }
  el.innerHTML = '<span class="tag">' + d.tags + '</span>' +
    ["breakfast","lunch","afternoon","dinner"].map(s => mealCard(d, s)).join("");
  wire(d);
}

function wire(d){
  document.querySelectorAll("select.fswap").forEach(sel => {
    sel.onchange = () => {
      const slot = sel.dataset.slot, id = sel.value;
      d[slot] = id;
      let also = 0;
      if (slot === "breakfast" && SMOOTHIES.includes(id) && SMOOTHIE_DAYS.includes(d.id))
        SMOOTHIE_DAYS.forEach(k => {
          const o = day(k);
          if (o && o !== d && typeof o.breakfast === "string" &&
              SMOOTHIES.includes(o.breakfast) && o.breakfast !== id){ o.breakfast = id; also++; }
        });
      save(); render();
      toast(FIXED[id].name + " in" + (also ? " \u2014 and on " + also +
            " other smoothie morning" + (also > 1 ? "s" : "") : ""));
    };
  });
  document.querySelectorAll("select.swap").forEach(sel => {
    sel.onchange = () => {
      const slot = sel.dataset.slot, id = sel.value;
      const from = sel.dataset.from || null;
      if (id === "__leftover"){            /* back to the tub it started as */
        d[slot] = {kind:"leftover", from};
        save(); render(); toast("Back to " + (day(from) ? day(from).title + "'s" : "the") + " leftovers");
        return;
      }
      if (FIXED[id]){                      /* the roast, the bought ones */
        d[slot] = {kind:"fixed", id};
        if (from) d[slot].wasFrom = from;
        save(); render(); toast(FIXED[id].name + " in");
        return;
      }
      const r = recipe(id), was = d[slot];
      const m = (was && was.kind === "recipe") ? was
              : {kind:"recipe", id, portions:1, daughter:false, alt:""};
      m.id = id; if (from) m.wasFrom = from; d[slot] = m;
      const diners = d.diners.filter(p => p !== "daughter" || m.daughter).length;
      if (m.portions < diners) m.portions = diners;
      save(); render(); toast(r.name + " in");
    };
  });
  document.querySelectorAll(".step button").forEach(b => {
    b.onclick = () => {
      const m = d[b.dataset.slot];
      m.portions = Math.max(1, Math.min(12, m.portions + (b.classList.contains("inc") ? 1 : -1)));
      save(); render();
    };
  });
  document.querySelectorAll('.dau input[type=checkbox]').forEach(c => {
    c.onchange = () => { d[c.id.replace("dau-","")].daughter = c.checked; save(); render(); };
  });
  document.querySelectorAll("input.alt").forEach(t => {
    t.oninput = () => { d[t.dataset.slot].alt = t.value; save(); };
  });
}

/* Some things are bought by number and nobody weighs them at the shop. "Bananas 1,514g"
   is a true figure and a useless one. Grams-per-unit are the same ones the recipe notes
   already use - 2 limes for 130g, 2 onions for 300g - so the count and the weight agree.
   Banana weights everywhere in this file are PEELED, which is the 196g trap: a medium
   banana is about 120g peeled and about 175g in the skin. */
const COUNT_UNIT = {
  "Bananas":                {each:120, one:"banana",   many:"bananas", note:"peeled weight"},
  "Lemons":                 {each:85,  one:"lemon",    many:"lemons"},
  "Limes":                  {each:65,  one:"lime",     many:"limes"},
  "Onions":                 {each:150, one:"onion",    many:"onions"},
  "Red onions":             {each:120, one:"red onion",many:"red onions"},
  "Red peppers":            {each:160, one:"pepper",   many:"peppers"},
  "Red and yellow peppers": {each:175, one:"pepper",   many:"peppers"},
  "Cucumber":               {each:300, one:"cucumber", many:"cucumbers"},
  "High-protein wraps":     {each:61,  one:"wrap",     many:"wraps", perPack:6}
};

/* ---------- shopping list ---------- */
function buildList(){
  const agg = {}, extras = [];
  const take = (list, scale) => (list||[]).forEach(i => {
    const k = i.item + "|" + (i.packUnit || "g");
    if (!agg[k]) agg[k] = {item:i.item, grams:0, aisle:i.aisle || "cupboard",
                           packSize:i.packSize || null, unit:i.packUnit || "g",
                           staple:!!i.staple, assumed:!!i.assumed};
    agg[k].grams += i.grams * scale;
    if (i.assumed) agg[k].assumed = true;
  });

  WEEK.days.forEach(d => {
    if (d.free) return;

    /* breakfasts, afternoon feeds and the roast accompaniments */
    ["breakfast","afternoon","lunch","dinner"].forEach(slot => {
      const m = d[slot];
      const f = (typeof m === "string") ? FIXED[m]
              : (m && m.kind === "fixed") ? FIXED[m.id] : null;

      /* Cheryl's own version of this slot, if she has one */
      const ov = (m && m.kind === "fixed" && m.cheryl) ? FIXED[m.cheryl] : null;
      if (ov && ov.ing && d.diners.includes("cheryl")) take(ov.ing.cheryl, 1);

      if (!f || !f.ing) return;
      if (d.diners.includes("jon")) take(f.ing.jon, 1);
      if (d.diners.includes("cheryl") && !ov) take(f.ing.cheryl, 1);
      take(f.ing.household, 1);
    });

    /* Cheryl's lunchtime Skyr, on every day she has a lunch that is actually a lunch */
    if (d.diners.includes("cheryl") && cherylAddonOn(d)) take(CHERYL_LUNCH_ING, 1);
    ["lunch","dinner"].forEach(slot => {
      const m = d[slot];
      if (!m || m.kind !== "recipe") return;
      const r = recipe(m.id); if (!r) return;
      const scale = m.portions / r.basePortions;
      take(r.ingredients, scale);
      if (!m.daughter && String(m.alt || "").trim())
        extras.push(d.label + ": " + m.alt.trim());
    });
  });

  const order = DATA.aisles || ["fresh","meat-fish","dairy","cupboard","frozen","bakery"];
  const names = {fresh:"Fresh", "meat-fish":"Meat & fish", dairy:"Dairy",
                 cupboard:"Cupboard", frozen:"Frozen", bakery:"Bakery"};
  const items = [], staples = [];

  Object.values(agg).forEach(a => {
    const g = Math.ceil(a.grams);
    let qty;
    const cu = (a.unit === "g") ? COUNT_UNIT[a.item] : null;
    if (cu){
      const n = Math.ceil(g / cu.each);
      qty = n + " " + (n === 1 ? cu.one : cu.many) +
            " \u00b7 about " + g + "g" + (cu.note ? " " + cu.note : "");
      if (cu.perPack){
        const packs = Math.ceil(n / cu.perPack);
        qty += " \u00b7 " + packs + " pack" + (packs > 1 ? "s" : "") + " of " + cu.perPack;
      }
    } else if (a.packSize){
      /* A 400g tin of beans is 400g of tin-and-liquid and about 235g of beans. Every recipe
         here specifies them drained, so the number of tins has to come off the DRAINED yield
         or the list buys too few - Jon ran short of butter beans on 21 September doing exactly
         this. Yields live in recipes.json so there is one place to correct them. */
      const drained = (DATA.drainedYields || {})[a.item];
      const per = drained || a.packSize;
      const packs = Math.ceil(g / per);
      qty = packs + " × " + a.packSize + a.unit;
      if (drained) qty += " · need " + g + a.unit + " drained";
      else if (packs * a.packSize > g) qty += " · need " + g + a.unit;
    } else qty = g + a.unit;
    if (a.assumed) qty += " · estimated";

    /* only small cupboard quantities stay in the check-you-have strip */
    /* Things kept in stock and counted in bottles or bars - Huel Black - belong in the
       check-you-have strip however many the week uses. Counting "4 bottles" against a
       pack of 1 made them "bulk" and put them on the list when the cupboard was full. */
    /* A drained ingredient is judged against what one tin drains to, not the tin's gross
       weight: "288g" of black beans sat in the strip looking like a tin's worth when it is
       two. More than one tin's drained yield goes on the main list with the tin count. */
    const drainedY = (DATA.drainedYields || {})[a.item];
    const bulk = (a.unit !== "g" && a.unit !== "ml") ? false
               : drainedY ? g > drainedY
               : (a.packSize ? g > a.packSize : g > 200);
    const amount = drainedY ? "1 tin \u00b7 " + g + "g drained"
                 : (a.unit === "g" || a.unit === "ml") ? g + a.unit
                 : g + " " + a.unit + (g > 1 ? "s" : "");
    if (a.staple && a.aisle === "cupboard" && !bulk) staples.push([a.item, amount]);
    else items.push([names[a.aisle] || "Cupboard", a.item, qty, order.indexOf(a.aisle)]);
  });

  items.sort((x,y) => (x[3] - y[3]) || x[1].localeCompare(y[1]));
  staples.sort((x,y) => x[0].localeCompare(y[0]));

  return {weekId:WEEK.id, built:Date.now(),
          items:items.map(i => [i[0], i[1], i[2]]), staples, extras};
}

$("#build").onclick = () => {
  const list = buildList();
  try { localStorage.setItem("list-" + WEEK.id, JSON.stringify(list));
        localStorage.setItem("list-current", WEEK.id); } catch(e){}
  toast(list.items.length + " items — opening the list");
  setTimeout(() => { location.href = "./?w=" + WEEK.id; }, 650);
};

/* The details element survives re-render, so only the reload case needs storing. */
$("#totals").addEventListener("toggle", e => {
  TOTALS_OPEN = e.target.open;
  document.body.classList.toggle("totals-open", TOTALS_OPEN);
  try { localStorage.setItem("totals-open", TOTALS_OPEN ? "1" : "0"); } catch(err){}
});

$("#reset").onclick = () => {
  if (!confirm("Put the week back to the original plan? Swaps and portions are lost.")) return;
  WEEK = clone(DEFAULT_WEEK); save(); render(); toast("Week reset");
};

let tid;
function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- boot ---------- */
/* no-cache forces a revalidation: without it a phone that has the page open keeps an
   old recipes.json and silently falls back to stale figures. */
fetch("recipes.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  DATA = d;
  DATA.recipes = DATA.recipes.concat([freeMeal("lunch"), freeMeal("dinner")]);
  BASE = pickWeek(); KEY = "plan-" + BASE.id; WEEK = load();

  /* "today" only means something on the week that actually contains today, and the
     week no longer starts on Monday, so find the day by its id rather than by index */
  const start = new Date(BASE.id + "T00:00:00");
  const days  = Math.floor((Date.now() - start.getTime()) / 86400000);
  const ID    = ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];
  TODAY = (days >= 0 && days < 7) ? WEEK.days.findIndex(x => x.id === ID) : -1;
  current = TODAY < 0 ? 0 : TODAY;

  const other = WEEKS[WEEKS.indexOf(BASE) === 0 ? 1 : 0];
  $("#wk").textContent = BASE.label;   /* the range is the identity; it must fit one line */
  document.title = "The week \u00b7 " + BASE.label;
  $("#flip").textContent = other.label + " →";
  $("#flip").onclick = () => {
    try { localStorage.setItem("week-choice", other.id); } catch(e){}
    location.reload();
  };
  render();
}).catch(err => {
  /* this used to swallow programming errors as "check your connection" */
  console.error("planner boot failed:", err);
  $("#day").innerHTML = '<p class="free"><strong>Couldn\'t load the week.</strong>' +
    'Check the connection and reload. If it keeps happening the page is broken, ' +
    'not your signal \u2014 the console says which.</p>';
});
</script>
